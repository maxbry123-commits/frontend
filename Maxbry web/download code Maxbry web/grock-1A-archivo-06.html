<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAXBRY AGI · HOME fusión</title>
<style>
:root{--bg:#F4F1EA;--fg:#18181b;--accent:#2563eb;--danger:#FF2A2A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
body.env-void{--bg:#0a0a0d;--fg:#F4F1EA;--accent:#00E5FF}
body.env-hud{--bg:#02060C;--fg:#D7F6FF;--accent:#00E5FF}
body.env-nebula{--bg:#0B0614;--fg:#F4F1EA;--accent:#F5C542}
body.env-paper{--bg:#F4F1EA;--fg:#18181b;--accent:#2563eb}
body.bw{filter:grayscale(1) contrast(1.15)}
#sky{position:fixed;inset:0;z-index:0;background:#0a0a0d center/cover no-repeat}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent 40%,color-mix(in oklab,var(--accent) 35%,transparent) 50%,transparent 60%);animation:scan 2.4s linear infinite;mix-blend-mode:screen;opacity:.55}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.burst img{position:fixed;z-index:3;width:min(32vw,240px);border-radius:18px;animation:exit 4.8s ease-in-out infinite}
.burst img:nth-child(1){left:6%;top:16%}
.burst img:nth-child(2){right:7%;top:18%;animation-delay:1.6s}
.burst img:nth-child(3){left:40%;bottom:10%;animation-delay:3.2s}
@keyframes exit{0%{opacity:0;transform:translateY(30px) scale(.86)}18%{opacity:1}55%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1.2)}}
header{position:fixed;z-index:8;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px}
.danger{position:fixed;z-index:9;left:50%;top:52px;transform:translateX(-50%);background:var(--danger);color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;max-width:min(92vw,680px)}
main{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 16px}
.word{font-size:clamp(52px,18vw,180px);font-weight:800;animation:netflix 2.6s both}
@keyframes netflix{from{letter-spacing:.55em;opacity:0;filter:blur(16px)}to{letter-spacing:-.05em;opacity:1;filter:none}}
.composer{margin-top:28px;width:min(720px,92vw);border:1px solid color-mix(in oklab,var(--fg) 16%,transparent);border-radius:28px;padding:14px;display:flex;gap:8px}
.composer input{flex:1;border:0;background:transparent;color:var(--fg);outline:none;font-size:16px}
.chips button,.dock button,header button{margin:4px;border-radius:999px;padding:8px 12px;cursor:pointer;background:transparent;color:var(--fg);border:1px solid color-mix(in oklab,var(--fg) 22%,transparent)}
.panel{position:fixed;z-index:10;right:12px;top:96px;bottom:86px;width:min(420px,92vw);overflow:auto;display:none;background:color-mix(in oklab,var(--bg) 88%,#000);padding:16px;border-radius:16px}
.panel.on{display:block}
.dock{position:fixed;right:12px;bottom:16px;display:flex;flex-direction:column;gap:8px}
</style></head>
<body class="env-paper">
<div id="sky"></div><div class="scan"></div>
<div class="burst"><img src="img-scene-01.jpg" alt="interestelar"><img src="img-hud-02.jpg" alt="hud"><img src="img-nct-03.jpg" alt="nct"></div>
<header><span>MAXBRY AGI · YAIWES · NCT CODE</span>
<nav><button data-env="env-paper">paper</button><button data-env="env-void">void</button><button data-env="env-hud">hud</button><button data-env="env-nebula">nebula</button></nav></header>
<div class="danger">PELIGRO CUPO · demanda supera inscripciones · espera sin SLA</div>
<main>
<div class="word">MAXBRY</div>
<div>AGI · YAIWES · NCT CODE</div>
<form class="composer" id="composer"><input id="q" placeholder="What should we explore?"><button>↑</button></form>
<div class="chips"><button data-panel="mods">Módulos</button><button data-panel="models">9 AI + 3 AGI</button><button data-panel="plans">Planes</button><button data-panel="wait">Cola</button></div>
<p id="log"></p>
</main>
<aside id="panel" class="panel"></aside>
<div class="dock"><button id="bw">B/N</button><button id="aud">Audio</button><label>Fondo<input id="bg" type="file" accept="image/*" hidden></label></div>
<script>
const sky=document.getElementById('sky'); const scenes=['img-scene-01.jpg','img-hud-02.jpg','img-nct-03.jpg']; let si=0;
sky.style.backgroundImage='url('+scenes[0]+')';
setInterval(()=>{si=(si+1)%3;sky.style.backgroundImage='url('+scenes[si]+')';},8000);
setInterval(()=>document.body.classList.toggle('bw'),7200);
document.getElementById('bw').onclick=()=>document.body.classList.toggle('bw');
document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.env;});
document.querySelector('label').onclick=()=>document.getElementById('bg').click();
document.getElementById('bg').onchange=e=>{const f=e.target.files[0]; if(f) sky.style.backgroundImage='url('+URL.createObjectURL(f)+')';};
const panels={mods:'<h2>Accesos</h2><p>5 code + NCT swarm + app + web + YAIWES + plugins/galería/voz/archivos/cámara/automatización/construcción + 12 habilidades + 5 web + memoria + proyectos + 12 intensidad + 8 especialidades + 8 expertos + 12 loops + 5 watchdog + 10 investigación + 10 workflow + 4 proyectos + 8 negocios + 3 personalización + 3 roles + 3 system prompt + 6 ciclo + video + storage + 16 especialidades + 10 skills</p>',models:'<h2>9 LLM + 3 AGI</h2><p>MAXBRY-MoE Qwen DeepSeek Kimi Grok Claude Gemini MiMo NCT-Coder | AGI Low Mid Studio</p>',plans:'<h2>Planes</h2><p>$59 $89 $100 $189 $150 $289 $899 +$599 AGI $100-1000 Studio $3000 · 20M contexto · créditos</p>',wait:'<h2>Cola</h2><button id="ticket">ticket</button><p id="tid"></p>'};
const panel=document.getElementById('panel');
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{panel.classList.add('on');panel.innerHTML=panels[b.dataset.panel]; const t=document.getElementById('ticket'); if(t) t.onclick=()=>document.getElementById('tid').textContent='COLA-'+crypto.randomUUID().slice(0,8);});
document.getElementById('composer').onsubmit=e=>{e.preventDefault();document.getElementById('log').textContent='cola demo · '+document.getElementById('q').value;};
let ac,on=false; document.getElementById('aud').onclick=()=>{if(!ac) ac=new AudioContext(); on=!on; if(on){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=64;g.gain.value=0.02;o.connect(g);g.connect(ac.destination);o.start();window._o=o;} else if(window._o) window._o.stop();};
</script></body></html>
