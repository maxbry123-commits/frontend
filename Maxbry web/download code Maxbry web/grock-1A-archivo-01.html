<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAXBRY AGI · Kimi paper</title>
<style>
:root { --bg:#F4F1EA; --fg:#111111; --accent:#111111; --danger:#FF2A2A; --gold:#F5C542; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--fg); font-family:Inter,ui-sans-serif,system-ui,sans-serif; overflow:hidden; }
body.invert { filter:invert(1) hue-rotate(180deg); }
#sky { position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse at 50% 120%, #1a1030 0%, transparent 55%), linear-gradient(180deg, transparent, #0004); }
#sky.userbg { background-size:cover; background-position:center; }
.scan { position:fixed; inset:0; z-index:1; pointer-events:none; background: conic-gradient(from 0deg, transparent 0 70%, color-mix(in oklab, var(--accent) 35%, transparent) 72%, transparent 78%); animation: spin 4s linear infinite; mix-blend-mode:screen; opacity:.55; }
@keyframes spin { to { transform: rotate(360deg); } }
header,footer { position:fixed; z-index:5; left:0; right:0; display:flex; gap:10px; align-items:center; padding:14px 18px; }
header { top:0; justify-content:space-between; backdrop-filter:blur(8px); }
footer { bottom:0; justify-content:center; font-size:12px; opacity:.85; }
nav a { color:var(--fg); text-decoration:none; border:1px solid color-mix(in oklab,var(--fg) 25%, transparent); padding:6px 10px; border-radius:999px; font-size:12px; }
.word { font-size:clamp(48px,16vw,168px); font-weight:800; letter-spacing:-.04em; background: linear-gradient(90deg,var(--fg),var(--accent),var(--fg)); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation: netflix 2.8s ease forwards, shimmer 6s linear 2.8s infinite; }
@keyframes netflix { from { letter-spacing:.4em; opacity:0; filter:blur(12px); } to { letter-spacing:-.04em; opacity:1; filter:blur(0); } }
@keyframes shimmer { to { background-position:200% 0; } }
.sub { margin-top:14px; letter-spacing:.28em; font-size:12px; opacity:.7; }
.chips { margin-top:22px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.chips b { border:1px solid color-mix(in oklab,var(--fg) 22%,transparent); padding:8px 12px; border-radius:999px; font-size:12px; }
.burst { position:fixed; z-index:2; inset:0; pointer-events:none; }
.card { position:absolute; width:min(28vw,220px); aspect-ratio:3/4; border-radius:18px; background: linear-gradient(145deg,var(--accent),#000); opacity:0; animation: fly 3.4s ease infinite; }
.card:nth-child(1) { left:8%; top:18%; }
.card:nth-child(2) { right:10%; top:22%; animation-delay:1.1s; }
.card:nth-child(3) { left:42%; bottom:8%; animation-delay:2.2s; }
@keyframes fly { 0%{opacity:0;transform:translateY(40px) scale(.8)} 25%{opacity:.95;transform:none} 100%{opacity:0;transform:translateY(-80px) scale(1.15)} }
.controls { position:fixed; z-index:6; right:14px; bottom:64px; display:flex; flex-direction:column; gap:8px; }
.controls button,.controls label { background:color-mix(in oklab,var(--bg) 70%, transparent); color:var(--fg); border:1px solid color-mix(in oklab,var(--fg) 25%,transparent); border-radius:10px; padding:8px 10px; cursor:pointer; font-size:12px; }
.danger { position:fixed; z-index:7; left:50%; top:54px; transform:translateX(-50%); background:var(--danger); color:#fff; padding:8px 14px; border-radius:8px; font-size:11px; animation: pulse 1.8s ease-in-out infinite; max-width:min(92vw,640px); }
@keyframes pulse { 50% { box-shadow:0 0 24px #ff2a2a88; } }
.env-paper { --bg:#F4F1EA; --fg:#111; } .env-void { --bg:#07070A; --fg:#F4F1EA; } .env-hud { --bg:#02060C; --fg:#D7F6FF; --accent:#00E5FF; } .env-nebula { --bg:#0B0614; --fg:#F4F1EA; --accent:#F5C542; }
.idtag { position:fixed; left:14px; bottom:14px; font-size:11px; opacity:.55; }
main { position:relative; z-index:3; height:100%; display:grid; place-items:center; text-align:center; padding:80px 16px; }
</style>
</head>
<body class="env-paper" data-file="grock-1A-archivo-01">
<div id="sky"></div><div class="scan"></div><div class="burst"><i class="card"></i><i class="card"></i><i class="card"></i></div>
<header><span>MAXBRY AGI · YAIWES · NCT CODE</span>
<nav><a href="grock-1A-archivo-01.html">01</a><a href="grock-1A-archivo-02.html">02</a><a href="grock-1A-archivo-03.html">03</a><a href="grock-1A-archivo-04.html">04</a><a href="grock-1A-archivo-05.html">05</a></nav></header>

<main><div><div class="word">MAXBRY</div><div class="sub">AGI · YAIWES · NCT CODE</div>
<div class="chips"><b>Chat</b><b>Planes</b><b>Benchmark</b><b>Bancos</b><b>Perfil AGI</b><b>UI YAIWES</b></div></div></main>
<div class="controls"><button id="inv">Invertir B/N</button><button id="env">Ambiente 4</button><button id="aud">Audio on/off</button><label>Fondo <input id="bg" type="file" accept="image/*" hidden></label></div>
<div class="idtag">grock-1A-archivo-01 · REVIEW</div>
<script>
const ENVS=["env-paper","env-void","env-hud","env-nebula"]; let ei=0;
document.getElementById("inv").onclick=()=>document.body.classList.toggle("invert");
document.getElementById("env").onclick=()=>{ENVS.forEach(e=>document.body.classList.remove(e)); ei=(ei+1)%4; document.body.classList.add(ENVS[ei]);};
document.querySelector("label").onclick=()=>document.getElementById("bg").click();
document.getElementById("bg").onchange=e=>{const f=e.target.files[0]; if(!f)return; const sky=document.getElementById("sky"); sky.classList.add("userbg"); sky.style.backgroundImage=`url(${URL.createObjectURL(f)})`;};
let ac,on=false; document.getElementById("aud").onclick=()=>{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); on=!on; if(on){ const o=ac.createOscillator(),g=ac.createGain(); o.type="sawtooth"; o.frequency.value=55; g.gain.value=0.03; o.connect(g); g.connect(ac.destination); o.start(); window._osc=o;} else if(window._osc) window._osc.stop(); };
setInterval(()=>document.body.classList.toggle("invert"),7200);
</script>
</body></html>
