<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAIWES UI Factory v1</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-rows:48px 72px 1fr 34px;height:100vh}.top{display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid #d8dee9}.brand{font-weight:800}.pill{border:1px solid #ccd5e2;border-radius:999px;padding:6px 10px;background:#fff}.ribbon{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #d8dee9;overflow:auto}.step{min-width:110px;border:0;border-radius:10px;padding:10px;background:#e8edf4}.step.active{background:#dbeafe;font-weight:700}.shell{display:grid;grid-template-columns:230px 1fr 280px;min-height:0}.panel{background:#fff;border-right:1px solid #d8dee9;padding:12px;overflow:auto}.right{border-right:0;border-left:1px solid #d8dee9}.panel h3{margin:4px 0 10px;font-size:14px}.palette{display:grid;gap:8px}.tool{padding:9px;border:1px solid #d8dee9;border-radius:9px;background:#fff;cursor:grab}.canvasWrap{padding:16px;overflow:auto}.canvas{min-height:100%;background:#fff;border:1px dashed #9aa8ba;border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:minmax(54px,auto);gap:10px}.node{position:relative;border:1px solid #bdc8d7;border-radius:10px;padding:12px;background:#fdfefe;grid-column:span 4;min-height:62px}.node.selected{outline:2px solid #2563eb}.node .tag{font-size:11px;opacity:.62}.node button,.node select,.node input{max-width:100%}.controls{display:grid;gap:8px}.controls input,.controls select,.controls textarea{width:100%;padding:8px;border:1px solid #ccd5e2;border-radius:8px}.controls textarea{min-height:90px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{padding:8px 10px;border:1px solid #c5ceda;border-radius:8px;background:#fff}.primary{background:#2563eb!important;color:#fff;border-color:#2563eb!important}.status{padding:7px 12px;background:#172033;color:#fff;font-size:12px;display:flex;justify-content:space-between}.hidden{display:none!important}.dropzone{border:1px dashed #9aa8ba;padding:10px;border-radius:9px;text-align:center}.log{font:11px ui-monospace,monospace;white-space:pre-wrap;background:#0f172a;color:#dbeafe;padding:8px;border-radius:8px;min-height:70px}.mobile .shell{grid-template-columns:1fr}.mobile .panel{display:none}.mobile .canvasWrap{padding:8px}.mobile .node{grid-column:span 12}@media(max-width:850px){.shell{grid-template-columns:1fr}.panel{display:none}.node{grid-column:span 12}}
</style>
</head>
<body>
<div class="app" id="app">
 <header class="top"><span class="brand">YAIWES · Fábrica UI</span><span class="pill" id="modeLabel">MANUAL</span><span class="pill" id="versionLabel">v1.0.0</span><span style="margin-left:auto" class="pill">Interno · Director</span></header>
 <nav class="ribbon" id="steps"></nav>
 <main class="shell">
  <aside class="panel"><h3>Componentes</h3><div class="palette" id="palette"></div><hr><h3>Proyecto</h3><div class="actions"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="clear">Limpiar</button></div><hr><h3>Modo</h3><div class="controls"><select id="mode"><option>MANUAL</option><option>AI_ASSIST</option><option>AUTOPILOT</option></select></div></aside>
  <section class="canvasWrap"><div class="canvas" id="canvas" aria-label="Canvas YAIWES"></div></section>
  <aside class="panel right"><section id="inspector"><h3>Inspector</h3><p>Selecciona un módulo.</p></section><section id="importer" class="hidden"><h3>Transformar componente</h3><div class="dropzone">Pega JSX/HTML/JSON o descripción</div><div class="controls"><textarea id="componentSource" placeholder="Componente o descripción…"></textarea><button class="primary" id="transform">Transformar → ficha</button><pre class="log" id="transformOut"></pre></div></section><section id="plugins" class="hidden"><h3>Backend / Plugins</h3><div class="controls"><select id="provider"><option>auto</option><option>Kimi K</option><option>MiniMax</option><option>DeepSeek V4</option><option>GLM-5</option><option>Meta</option><option>GPT-OSS</option></select><button id="health">Verificar referencias</button><div class="log" id="pluginLog">secret_ref only · no API keys in browser</div></div></section><section id="ai" class="hidden"><h3>AI Assist</h3><div class="controls"><textarea id="aiPrompt" placeholder="Ej.: crea una ventana de chat con selector de modelos"></textarea><button class="primary" id="propose">Generar delta local</button><button id="applyDelta">Aplicar delta</button><pre class="log" id="aiLog"></pre></div></section><section id="publish" class="hidden"><h3>Validar y exportar</h3><div class="actions"><button id="validate">Validar</button><button class="primary" id="export">Exportar JSON</button></div><pre class="log" id="validation"></pre></section></aside>
 </main>
 <footer class="status"><span id="status">ACTIVE_LOOP · Paso 1</span><span id="count">0 módulos</span></footer>
</div>
<script>
(()=>{
 const STEPS=[['CREAR','Controles'],['COMPONER','Canvas'],['TRANSFORMAR','Importar'],['IA','Assist/Autopilot'],['VALIDAR','Build/Export']];
 const TYPES={window:{label:'Ventana',html:'<strong>Nueva ventana</strong><p>Contenido modular</p>'},button:{label:'Botón',html:'<button>Acción</button>'},select:{label:'Selector',html:'<select><option>Opción A</option><option>Opción B</option></select>'},segment:{label:'Segmento',html:'<div>◉ General &nbsp; ○ Avanzado</div>'},chat:{label:'Chat',html:'<div>YAIWES Chat</div><input placeholder="Escribe una tarea…">'},plugin:{label:'Plugin panel',html:'<div>Plugin / Adapter</div><small>contract → adapter → registry → loader</small>'},toolbar:{label:'Ribbon',html:'<div>Inicio · Insertar · Diseño · IA · Publicar</div>'},card:{label:'Tarjeta',html:'<strong>Tarjeta</strong><p>Dato / acción</p>'}};
 const $=s=>document.querySelector(s), canvas=$('#canvas'); let step=0, selected=null, past=[],future=[],pendingDelta=null;
 let state={version:'1.0.0',mode:'MANUAL',nodes:[]};
 const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();
 function snapshot(){past.push(JSON.stringify(state));if(past.length>50)past.shift();future=[]}
 function save(){localStorage.setItem('yaiwes.factory.v1',JSON.stringify(state));render()}
 function add(type,x){snapshot();state.nodes.push({id:id(),type,title:TYPES[type]?.label||type,span:4,content:TYPES[type]?.html||String(x||'Módulo')});save()}
 function render(){
  $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="step ${i===step?'active':''}" data-step="${i}">${i+1}. ${s[0]}<br><small>${s[1]}</small></button>`).join('');
  $('#palette').innerHTML=Object.keys(TYPES).map(t=>`<div class="tool" draggable="true" data-type="${t}">＋ ${TYPES[t].label}</div>`).join('');
  canvas.innerHTML=state.nodes.length?state.nodes.map(n=>`<article class="node ${selected===n.id?'selected':''}" data-id="${n.id}" draggable="true" style="grid-column:span ${n.span}"><span class="tag">${n.type}</span><div>${n.content}</div></article>`).join(''):'<div style="grid-column:span 12;text-align:center;padding:48px;opacity:.55">Arrastra un componente aquí</div>';
  $('#mode').value=state.mode;$('#modeLabel').textContent=state.mode;$('#count').textContent=`${state.nodes.length} módulos`;$('#status').textContent=`ACTIVE_LOOP · Paso ${step+1} ${STEPS[step][0]}`;
  ['importer','plugins','ai','publish'].forEach(x=>$('#'+x).classList.add('hidden')); if(step===2)$('#importer').classList.remove('hidden');if(step===3){$('#ai').classList.remove('hidden');$('#plugins').classList.remove('hidden')}if(step===4)$('#publish').classList.remove('hidden');
  const n=state.nodes.find(n=>n.id===selected);$('#inspector').innerHTML=n?`<h3>Inspector</h3><div class="controls"><label>Título<input id="propTitle" value="${escapeHtml(n.title)}"></label><label>Ancho<select id="propSpan"><option value="3">25%</option><option value="4">33%</option><option value="6">50%</option><option value="12">100%</option></select></label><button id="deleteNode">Eliminar</button></div>`:'<h3>Inspector</h3><p>Selecciona un módulo.</p>'; if(n){$('#propSpan').value=n.span;$('#propTitle').onchange=e=>{snapshot();n.title=e.target.value;save()};$('#propSpan').onchange=e=>{snapshot();n.span=+e.target.value;save()};$('#deleteNode').onclick=()=>{snapshot();state.nodes=state.nodes.filter(x=>x.id!==n.id);selected=null;save()}}
  bindDynamic();
 }
 function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function bindDynamic(){document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});document.querySelectorAll('.tool').forEach(t=>t.ondragstart=e=>e.dataTransfer.setData('text/yaiwes-type',t.dataset.type));document.querySelectorAll('.node').forEach(n=>n.onclick=()=>{selected=n.dataset.id;render()})}
 canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();let t=e.dataTransfer.getData('text/yaiwes-type');if(t)add(t)};
 $('#mode').onchange=e=>{state.mode=e.target.value;save()};$('#clear').onclick=()=>{snapshot();state.nodes=[];selected=null;save()};
 $('#undo').onclick=()=>{if(!past.length)return;future.push(JSON.stringify(state));state=JSON.parse(past.pop());save()};$('#redo').onclick=()=>{if(!future.length)return;past.push(JSON.stringify(state));state=JSON.parse(future.pop());save()};
 $('#transform').onclick=()=>{let src=$('#componentSource').value.trim();if(!src)return;let kind=/<button/i.test(src)?'button':/<select/i.test(src)?'select':'card';let ficha={artifact_id:'yaiwes.ui.'+kind+'_'+Date.now(),version:'1.0.0',estado:'draft',contrato:{rol:'transform',consume:{datatype:{family:'ui',type:'component_source',version:1}},expone:{datatype:{family:'ui',type:'factory_node',version:1}}},ejecucion:{kind:'code',transport:'importlib',runtime_type:'compute',idempotente:true},seguridad:{sandbox:'process',permisos:[],limites:{timeout_ms:5000}},secret_ref:null};$('#transformOut').textContent=JSON.stringify(ficha,null,2);add(kind)};
 $('#propose').onclick=()=>{let q=$('#aiPrompt').value.toLowerCase(),types=[];if(q.includes('chat'))types.push('chat');if(q.includes('selector')||q.includes('modelo'))types.push('select');if(q.includes('ventana'))types.push('window');if(q.includes('plugin')||q.includes('backend'))types.push('plugin');if(!types.length)types=['card'];pendingDelta={op:'add',types};$('#aiLog').textContent='DELTA CANDIDATO\n'+JSON.stringify(pendingDelta,null,2)+'\nNo aplicado todavía.'};
 $('#applyDelta').onclick=()=>{if(!pendingDelta)return;pendingDelta.types.forEach(t=>add(t));$('#aiLog').textContent+='\nAPLICADO localmente.';pendingDelta=null};
 $('#health').onclick=()=>$('#pluginLog').textContent='Frontend contract check: OK\nProvider: '+$('#provider').value+'\nCredential: secret_ref only\nNetwork provider call: backend responsibility';
 $('#validate').onclick=()=>{let errs=[];if(!state.nodes.length)errs.push('Canvas vacío');let ids=new Set;state.nodes.forEach(n=>{if(ids.has(n.id))errs.push('ID duplicado');ids.add(n.id);if(!TYPES[n.type])errs.push('Tipo no registrado: '+n.type)});$('#validation').textContent=errs.length?'FAIL\n'+errs.join('\n'):'LOCAL STATIC PASS\nSchema básico: PASS\nIDs: PASS\nComponent registry: PASS\nNota: runtime/backend E2E pendiente de verifier independiente.'};
 $('#export').onclick=()=>{let blob=new Blob([JSON.stringify({...state,exported_at:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yaiwes-ui-project.json';a.click();URL.revokeObjectURL(a.href)};
 let loaded=localStorage.getItem('yaiwes.factory.v1');if(loaded)try{state=JSON.parse(loaded)}catch{} render();
})();
</script>
</body></html>
