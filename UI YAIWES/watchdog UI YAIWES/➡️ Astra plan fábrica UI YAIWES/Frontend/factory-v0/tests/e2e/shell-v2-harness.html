<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YAIWES SEG-01-SHELL v2 harness</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../workspace-shell-v2.css">
</head>
<body>
<div id="app" class="app-shell" data-shell-harness="v2">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">Y</span><div><strong>YAIWES UI Factory</strong><small>SEG-01-SHELL v2 isolated harness</small></div></div>
  </header>
  <main class="studio">
    <aside class="library-pane" aria-label="Elementos y capas">
      <div class="pane-head"><div><small>BIBLIOTECA</small><h2>Elementos</h2></div></div>
      <div id="component-library" class="component-grid">
        <button class="component-card"><strong>Ventana</strong><span>bloque</span></button>
        <button class="component-card"><strong>Botón</strong><span>bloque</span></button>
        <button class="component-card"><strong>Imagen</strong><span>bloque</span></button>
        <button class="component-card"><strong>Texto</strong><span>bloque</span></button>
        <button class="component-card"><strong>Formulario</strong><span>bloque</span></button>
        <button class="component-card"><strong>Lista</strong><span>bloque</span></button>
        <button class="component-card"><strong>Tabla</strong><span>bloque</span></button>
        <button class="component-card"><strong>Video</strong><span>bloque</span></button>
      </div>
      <div class="library-help">Harness aislado de SEG-01-SHELL v2. No es el candidato canónico.</div>
      <div class="layers-head"><div><small>ESTRUCTURA</small><h2>Capas</h2></div></div>
      <div id="layer-list" class="layer-list"></div>
    </aside>
    <section class="canvas-pane">
      <div class="canvas-toolbar">
        <div><small>PASO 1</small><strong>Crear</strong></div>
      </div>
      <div class="canvas-stage"><div id="canvas" class="canvas" aria-label="Canvas de composición"><div class="canvas-empty"><strong>Canvas listo</strong><span>Canvas-first v2</span></div></div></div>
    </section>
    <aside class="context-pane" aria-label="Panel contextual">
      <div class="context-head"><div><small>HERRAMIENTAS</small><h2>Inspector</h2></div></div>
      <div id="context-scroll" class="context-scroll"><p>Inspector v2</p></div>
    </aside>
  </main>
  <footer class="bottom-bar"><button type="button">Deshacer</button></footer>
</div>
<script type="module" src="../../src/ui/workspace-shell-v2.js"></script>
</body>
</html>
