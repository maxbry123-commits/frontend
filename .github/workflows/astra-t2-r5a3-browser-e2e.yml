name: astra-t2-r5a3-browser-e2e

on:
  push:
    paths:
      - 'UI YAIWES interface/Fromtend/modules/M_RUNTIME_ORCHESTRATION/runtime-orchestration-contract.mjs'
      - 'UI YAIWES interface/Fromtend/modules/M_RUNTIME_ORCHESTRATION/adapters/codemirror-adapter.mjs'
      - 'UI YAIWES interface/Fromtend/modules/M_RUNTIME_ORCHESTRATION/e2e/**'
      - '.github/workflows/astra-t2-r5a3-browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned browser harness dependencies
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts \
            codemirror@6.0.2 \
            @codemirror/state@6.5.2 \
            @codemirror/view@6.38.1 \
            esbuild@0.25.9 \
            playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Bundle frontend-only E2E harness
        run: |
          mkdir -p .r5a3-e2e
          npx esbuild 'UI YAIWES interface/Fromtend/modules/M_RUNTIME_ORCHESTRATION/e2e/browser-entry.mjs' \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=.r5a3-e2e/app.js
          cp 'UI YAIWES interface/Fromtend/modules/M_RUNTIME_ORCHESTRATION/e2e/index.html' .r5a3-e2e/index.html

      - name: Run RUN-07 RUN-08 real-browser E2E
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .r5a3-e2e > /tmp/r5a3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          E2E_URL='http://127.0.0.1:4173/index.html' node 'UI YAIWES interface/Fromtend/modules/M_RUNTIME_ORCHESTRATION/e2e/browser-e2e.mjs'
