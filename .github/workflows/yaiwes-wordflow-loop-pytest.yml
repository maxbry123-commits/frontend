name: YAIWES Wordflow LOOP Pytest

on:
  push:
    paths:
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop/**'
      - '.github/workflows/yaiwes-wordflow-loop-pytest.yml'
  workflow_dispatch:

concurrency:
  group: yaiwes-wordflow-loop-pytest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and pytest
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Wordflow LOOP tests
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop'
        run: python -m pytest -q
