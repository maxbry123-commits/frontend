name: YAIWES Wordflow LOOP Pytest

on:
  push:
    paths:
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/plugins/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_universal_plugins.py'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_fables_socket.py'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_stabilize_integration.py'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_stabilize_adapter_guards.py'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/vendor/stabilize/orchestrator.py'
      - '.github/workflows/yaiwes-wordflow-loop-pytest.yml'
  workflow_dispatch:

concurrency:
  group: yaiwes-wordflow-loop-pytest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/plugins
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_universal_plugins.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_fables_socket.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_stabilize_integration.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_stabilize_adapter_guards.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/vendor/stabilize/orchestrator.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Wordflow package and pytest
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Wordflow LOOP tests
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop'
        run: python -m pytest -q
      - name: Run universal socket, Fables and Stabilize bridge tests
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
        run: >-
          python -m pytest -q
          tests/test_universal_plugins.py
          tests/test_fables_socket.py
          tests/test_stabilize_integration.py
          tests/test_stabilize_adapter_guards.py
