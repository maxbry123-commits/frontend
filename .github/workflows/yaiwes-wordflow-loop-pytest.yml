name: YAIWES Wordflow LOOP Pytest

on:
  push:
    paths:
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/core/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/plugins/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/governance/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/**'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/vendor/stabilize/orchestrator.py'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/vendor/rule_engine/**'
      - '.github/workflows/yaiwes-wordflow-loop-pytest.yml'
  workflow_dispatch:

concurrency:
  group: yaiwes-wordflow-loop-pytest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/core
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/plugins
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/governance
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/vendor/stabilize/orchestrator.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/vendor/rule_engine
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic test dependencies
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest 'pydantic==2.14.0b1'
      - name: Run Wordflow LOOP tests
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop'
        run: python -m pytest -q
      - name: Run complete YAIWES runtime test suite
        working-directory: 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
        run: python -m pytest -q tests
