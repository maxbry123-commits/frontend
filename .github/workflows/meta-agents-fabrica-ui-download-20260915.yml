name: Meta Agents -> Fabrica UI + UI YAIWES
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/meta-agents-fabrica-ui-download-20260915.yml']
permissions:
  contents: write
concurrency:
  group: meta-agents-fabrica-ui-single-writer
  cancel-in-progress: false
jobs:
  download-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, lfs: false}
      - name: Download pinned official Meta repositories and extract capability slices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, shutil, json
          from pathlib import Path
          repos=[
            ('muse-code-sdk','https://github.com/meta-models/muse-code-sdk.git','fbce769ccb75ab971d00e01a00fe076de4c773fc'),
            ('meta-oss-cookbook','https://github.com/meta-models/meta-oss-cookbook.git','499ad7422c2175cf47dbad5df37c4c8f6c11f924'),
            ('meta-model-cookbook','https://github.com/meta-models/meta-model-cookbook.git','fb440d68f9f1eb735faca57092b0729ad6195d96'),
          ]
          factory=Path('fabrica de UI INTERFACE fromtend/Meta Agents 2026')
          ui=Path('UI YAIWES/Meta Agents integration sources')
          work=Path('_work/meta-agents'); work.mkdir(parents=True,exist_ok=True)
          rows=[]
          for slug,url,ref in repos:
            src=work/slug
            subprocess.run(['git','clone','--filter=blob:none','--no-checkout',url,str(src)],check=True)
            subprocess.run(['git','-C',str(src),'fetch','--depth','1','origin',ref],check=True)
            subprocess.run(['git','-C',str(src),'checkout','--detach',ref],check=True)
            actual=subprocess.check_output(['git','-C',str(src),'rev-parse','HEAD'],text=True).strip()
            if actual!=ref: raise SystemExit(f'SHA_MISMATCH {slug}')
            shutil.rmtree(src/'.git',ignore_errors=True)
            dst=factory/slug
            if dst.exists(): shutil.rmtree(dst)
            shutil.copytree(src,dst)
            rows.append({'repo':slug,'url':url[:-4],'commit':ref,'destination':str(dst)})
          mappings=[
            ('meta-oss-cookbook/agentic-fundamentals','MetaCua-Glimmer-agentic-fundamentals'),
            ('meta-model-cookbook/02_agent_patterns','CUA-MCP-and-agentic-patterns'),
            ('meta-model-cookbook/04_muse_code','Multi-Agent-and-Muse-Code-patterns'),
          ]
          copied=[]
          for rel,name in mappings:
            src=factory/rel
            if not src.exists(): raise SystemExit(f'MISSING_INTEGRATION_SOURCE {src}')
            dst=ui/name
            if dst.exists(): shutil.rmtree(dst)
            shutil.copytree(src,dst)
            copied.append({'source':str(src),'destination':str(dst)})
          (factory/'DOWNLOAD_EVIDENCE.json').write_text(json.dumps(rows,indent=2)+'\n')
          (ui/'INTEGRATION_EVIDENCE.json').write_text(json.dumps(copied,indent=2)+'\n')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f 'fabrica de UI INTERFACE fromtend/Meta Agents 2026/DOWNLOAD_EVIDENCE.json'
          test -d 'fabrica de UI INTERFACE fromtend/Meta Agents 2026/muse-code-sdk'
          test -d 'fabrica de UI INTERFACE fromtend/Meta Agents 2026/meta-oss-cookbook'
          test -d 'fabrica de UI INTERFACE fromtend/Meta Agents 2026/meta-model-cookbook'
          test -d 'UI YAIWES/Meta Agents integration sources/MetaCua-Glimmer-agentic-fundamentals'
          test -d 'UI YAIWES/Meta Agents integration sources/CUA-MCP-and-agentic-patterns'
          test -d 'UI YAIWES/Meta Agents integration sources/Multi-Agent-and-Muse-Code-patterns'
          test -f 'UI YAIWES/Meta Agents integration sources/INTEGRATION_EVIDENCE.json'
          rm -rf _work
          git add -- 'fabrica de UI INTERFACE fromtend/Meta Agents 2026' 'UI YAIWES/Meta Agents integration sources'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo 'No vendor delta; validation complete.'; exit 0; fi
          START_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          REMOTE_SHA="$(git rev-parse origin/main)"
          test "$START_SHA" = "$REMOTE_SHA" || { echo "HEAD_MOVED start=$START_SHA remote=$REMOTE_SHA"; exit 42; }
          git commit -m 'build(download): vendor Meta agent sources for UI workflows'
          git push origin HEAD:main
