name: factory-f-ctl-011-version-rollback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-f-ctl-011-version-rollback.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-ctl-011-version-rollback.spec.mjs'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/version-store-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/actions.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/index-v192.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-rollback-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - name: Checkout exact Factory subtree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check src/version-store-v1.js
          node --check tests/e2e/f-ctl-011-version-rollback.spec.mjs
      - name: F-CTL-011 browser gate
        run: npx playwright test tests/e2e/f-ctl-011-version-rollback.spec.mjs --project=chromium-desktop --reporter=line
