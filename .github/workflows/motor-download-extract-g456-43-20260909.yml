name: Motor Download Extract G456 43 20260909
run-name: Motor Download Extract G456 43 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motor-download-extract-g456-43-20260909.yml'

permissions:
  contents: write

concurrency:
  group: motor-download-extract-g456-43-20260909
  cancel-in-progress: false

