name: factory-f-ctl-009
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-f-ctl-009.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-ctl-009-zoom-fit-minimap.spec.mjs'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/donors/xyflow-minimap-adapter.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/app-v19.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/index-v192.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-f-ctl-009
  cancel-in-progress: false
jobs:
  zoom-fit-minimap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check src/app-v19.js
          node --check src/donors/xyflow-minimap-adapter.js
          node --check tests/e2e/f-ctl-009-zoom-fit-minimap.spec.mjs
      - name: F-CTL-009 browser gate
        run: npx playwright test tests/e2e/f-ctl-009-zoom-fit-minimap.spec.mjs --project=chromium-desktop --reporter=line
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ctl-009-evidence
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results
          if-no-files-found: warn
          retention-days: 14
