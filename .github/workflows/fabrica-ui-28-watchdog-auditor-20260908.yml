name: Fabrica UI 28 Watchdog Auditor
run-name: Fabrica UI 28 Watchdog Auditor • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: fabrica-ui-28-watchdog-auditor-20260908
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout destination NO-LFS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Four-pass independent audit
        id: audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Q='scripts/fabrica-ui-28-download-extract-20260908/QUEUE.json'
          ROOT='fabrica de UI INTERFACE fromtend'
          mkdir -p "$RUNNER_TEMP/fabrica-audit"
          python3 - "$Q" "$ROOT" "$RUNNER_TEMP/fabrica-audit/audit.json" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,pathlib,sys
          q=json.load(open(sys.argv[1],encoding='utf-8')); root=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3]); rows=[]; verified=0
          for c in q['components']:
              d=root/c['slug']; reasons=[]
              if not d.is_dir(): reasons.append('DESTINATION_MISSING')
              else:
                  for f in ('SOURCE_URL.txt','SOURCE_COMMIT.txt','SOURCE_SHA256SUMS.txt'):
                      if not (d/f).is_file(): reasons.append('TRACE_MISSING:'+f)
                  sums=d/'SOURCE_SHA256SUMS.txt'
                  if sums.is_file():
                      for line in sums.read_text(encoding='utf-8',errors='replace').splitlines():
                          if not line.strip(): continue
                          try: digest,rel=line.split('  ',1); p=d/rel
                          except ValueError: reasons.append('SUM_FORMAT_GAP'); break
                          if not p.is_file(): reasons.append('READ_BACK_MISSING:'+rel); break
                          h=hashlib.sha256()
                          with p.open('rb') as fh:
                              for b in iter(lambda:fh.read(1024*1024),b''): h.update(b)
                          if h.hexdigest()!=digest: reasons.append('READ_BACK_HASH_GAP:'+rel); break
              if not reasons: verified+=1
              rows.append({'director_index':c['director_index'],'slug':c['slug'],'status':'VERIFIED' if not reasons else 'GAP','reasons':reasons})
          report={'passes':['actions/logs','sha/tree','destination/provenance','read-back/manifest'],'director_alternatives':28,'expected_source_trees':29,'verified_source_trees':verified,'remaining_gaps':29-verified,'failures':sum(1 for r in rows if r['status']=='GAP'),'rows':rows,'verdict':'VERIFIED_CLOSED' if verified==29 else 'ACTIVE_LOOP'}
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(sys.argv[4],'a') as f: f.write('gaps='+str(report['remaining_gaps'])+'\n')
          print(json.dumps({k:report[k] for k in ('verified_source_trees','remaining_gaps','failures','verdict')}))
          PY
      - name: Detect active producer before repair
        id: active
        if: steps.audit.outputs.gaps != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          n=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100" |
            jq '[.workflow_runs[] | select(.path==".github/workflows/fabrica-ui-28-download-extract-20260908.yml")] | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Dispatch Repair Guardian only for gaps with no active producer
        if: steps.audit.outputs.gaps != '0' && steps.active.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/fabrica-ui-28-repair-guardian-20260908.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'REPAIR_GUARDIAN_DISPATCHED'
      - name: Passive while producer active
        if: steps.audit.outputs.gaps != '0' && steps.active.outputs.count != '0'
        run: echo 'PASSIVE_WATCHDOG_PRODUCER_ACTIVE'
      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrica-ui-28-watchdog-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/fabrica-audit/
          if-no-files-found: warn
