name: YAIWES Wordflow Runtime Recovery

on:
  pull_request:
    paths:
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop/**'
      - '.github/workflows/yaiwes-wordflow-runtime-recovery-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaiwes-wordflow-runtime-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Wordflow recovery tests
        working-directory: UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop
        run: pytest -q
