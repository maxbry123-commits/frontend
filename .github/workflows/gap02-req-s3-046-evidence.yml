name: GAP02 REQ-S3-046 Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gap02-req-s3-046-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_memory_boundary.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/requirement_traces/REQ-S3-046.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/evidence/requirement_traces/REQ-S3-046.ci.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused REQ-S3-046 regression
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m unittest -v tests.test_memory_boundary.MemoryBoundaryTests.test_s3_046_literal_memory_operations_contract_is_complete
      - name: REQ-S3-046 five-pass
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES'
          PYTHONPATH=runtime/src python - <<'PY'
          from pathlib import Path
          from audit.evidence import TrustedCIExecution, make_ci_verifier
          from audit.five_pass import audit_five_pass
          from coverage.trace_inventory import load_trace_inventory

          root = Path('.').resolve()
          trace = load_trace_inventory(root / 'runtime/requirement_traces', ('REQ-S3-046',))[0]

          def trusted_lookup(run_id: int, job_id: int) -> TrustedCIExecution:
              assert (run_id, job_id) == (34827469610, 103922812582)
              return TrustedCIExecution(
                  run_id=run_id,
                  job_id=job_id,
                  revision='b6091a7b95b5d4c629786c3a0da1a4367c06606f',
                  status='completed',
                  conclusion='success',
                  implementation_sha256='18d1f243ba2f191923d9438be89fb3022ea5ab26a6f8d973f43f9478300c605e',
                  test_sha256='a19fe978c403cfb2cbd198b493273882933734e8f03f53faddb55621da9ca685',
              )

          result = audit_five_pass(
              root,
              ('REQ-S3-046',),
              (trace,),
              (trace.implementation.path,),
              make_ci_verifier(trusted_lookup),
          )
          print(result)
          assert result.status == 'TRACEABILITY_PASS'
          assert result.verified_requirements == 1
          assert result.total_requirements == 1
          PY
