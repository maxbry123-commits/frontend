name: GAP03 REQ-S1-003 Five Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gap03-req-s1-003-five-pass.yml'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/requirement_traces/REQ-S1-003.json'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/evidence/requirement_traces/REQ-S1-003.ci.json'
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_coverage_req_s1_003.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/audit
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/coverage
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/plugins
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_universal_plugins.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_coverage_req_s1_003.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/requirement_traces/REQ-S1-003.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/evidence/requirement_traces/REQ-S1-003.ci.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/documentos proyectos UI YAIWES/📌MAX-SYSTEM-100X-FINAL-1.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Exact source code test hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES'
          sha256sum "$ROOT/documentos proyectos UI YAIWES/📌MAX-SYSTEM-100X-FINAL-1.md"
          sha256sum "$ROOT/runtime/src/plugins/catalog.py"
          sha256sum "$ROOT/runtime/tests/test_universal_plugins.py"
      - name: Focused REQ-S1-003 behavior
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m unittest -v \
            tests.test_universal_plugins.UniversalPluginTests.test_catalog_is_14_unique_components \
            tests.test_universal_plugins.UniversalPluginTests.test_no_component_is_mounted_before_wiring \
            tests.test_universal_plugins.UniversalPluginTests.test_donor_ui_and_tool_entries_remain_fail_closed
      - name: Focused REQ-S1-003 five-pass if trace exists
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          if test -f tests/test_coverage_req_s1_003.py && test -f requirement_traces/REQ-S1-003.json && test -f evidence/requirement_traces/REQ-S1-003.ci.json; then
            PYTHONPATH=src python -m pytest -q tests/test_coverage_req_s1_003.py::test_req_s1_003_oss_reuse_traceability_pass
          else
            echo 'TRACE_BOOTSTRAP_PENDING'
          fi
