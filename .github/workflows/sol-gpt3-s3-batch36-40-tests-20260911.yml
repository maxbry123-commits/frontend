name: S3 Batch 36-40 Vendor Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sol-gpt3-s3-batch36-40-tests-20260911.yml'

permissions:
  contents: read

concurrency:
  group: sol-gpt3-s3-batch36-40-tests-20260911
  cancel-in-progress: false

jobs:
  react-toastify-36:
    name: '36 React-Toastify'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/React-Toastify
          sparse-checkout-cone-mode: false
      - name: Copy snapshot to path without spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/react-toastify"
          cp -a "UI YAIWES/componentes open soure UI YAIWES/React-Toastify/." "$RUNNER_TEMP/react-toastify/"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/react-toastify
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ${{ runner.temp }}/react-toastify
        run: pnpm build
      - name: Cypress component tests
        working-directory: ${{ runner.temp }}/react-toastify
        run: pnpm run test:run

  sortablejs-37:
    name: '37 SortableJS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/SortableJS
          sparse-checkout-cone-mode: false
      - name: Copy snapshot to path without spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sortablejs"
          cp -a "UI YAIWES/componentes open soure UI YAIWES/SortableJS/." "$RUNNER_TEMP/sortablejs/"
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/sortablejs
        run: npm ci
      - name: Compatibility assertions
        working-directory: ${{ runner.temp }}/sortablejs
        run: npm run test:compat
      - name: Browser tests via upstream TestCafe harness
        working-directory: ${{ runner.temp }}/sortablejs
        run: npm test

  chartjs-38:
    name: '38 Chart.js'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Chart.js
          sparse-checkout-cone-mode: false
      - name: Copy snapshot to path without spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chartjs"
          cp -a "UI YAIWES/componentes open soure UI YAIWES/Chart.js/." "$RUNNER_TEMP/chartjs/"
      - uses: pnpm/action-setup@v4
        with:
          version: 8.13.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/chartjs
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ${{ runner.temp }}/chartjs
        run: pnpm run lint
      - name: Build
        working-directory: ${{ runner.temp }}/chartjs
        run: pnpm run build
      - name: Upstream CI tests under Xvfb
        working-directory: ${{ runner.temp }}/chartjs
        run: xvfb-run --auto-servernum pnpm run test-ci

  excalidraw-39:
    name: '39 Excalidraw'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Excalidraw
          sparse-checkout-cone-mode: false
      - name: Copy snapshot to path without spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/excalidraw"
          cp -a "UI YAIWES/componentes open soure UI YAIWES/Excalidraw/." "$RUNNER_TEMP/excalidraw/"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/excalidraw
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile
      - name: Run complete local test gate
        working-directory: ${{ runner.temp }}/excalidraw
        run: yarn test:all

  uppy-40:
    name: '40 Uppy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YARN_ENABLE_GLOBAL_CACHE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Uppy/code
          sparse-checkout-cone-mode: false
      - name: Copy snapshot to path without spaces
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/uppy"
          cp -a "UI YAIWES/componentes open soure UI YAIWES/Uppy/code/." "$RUNNER_TEMP/uppy/"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack and install immutable workspace
        working-directory: ${{ runner.temp }}/uppy
        run: |
          corepack enable
          corepack yarn install --immutable
      - name: Install upstream Playwright Chromium
        working-directory: ${{ runner.temp }}/uppy
        run: corepack yarn workspace @uppy/dashboard playwright install --with-deps chromium
      - name: Build packages
        working-directory: ${{ runner.temp }}/uppy
        run: corepack yarn run build
      - name: Run tests
        working-directory: ${{ runner.temp }}/uppy
        env:
          COMPANION_DATADIR: ./output
          COMPANION_DOMAIN: localhost:3020
          COMPANION_PROTOCOL: http
          COMPANION_REDIS_URL: redis://localhost:6379
          VITE_MINIO_CONFIG: 'test_user,test_password,http://localhost:9002/test-bucket,us-east-1'
        run: corepack yarn run test
      - name: Typecheck
        working-directory: ${{ runner.temp }}/uppy
        run: corepack yarn run typecheck
      - name: Build and check examples
        working-directory: ${{ runner.temp }}/uppy
        run: corepack yarn run build:examples
      - name: Biome CI
        working-directory: ${{ runner.temp }}/uppy
        run: corepack yarn run check:ci
