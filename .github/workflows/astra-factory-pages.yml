name: Astra Factory UI Preview Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-factory-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astra-factory-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified preview payload only
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/maxbry123-commits/frontend/astra-factory-preview'
          rm -rf _site
          mkdir -p _site/src
          curl -fsSL "$BASE/index.html" -o _site/index.html
          curl -fsSL "$BASE/styles.css" -o _site/styles.css
          curl -fsSL "$BASE/src/app.js" -o _site/src/app.js
          curl -fsSL "$BASE/src/actions.js" -o _site/src/actions.js
          curl -fsSL "$BASE/src/state.js" -o _site/src/state.js
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/src/app.js
          grep -q 'YAIWES' _site/index.html
          echo 'SITE_PAYLOAD=VERIFIED'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
