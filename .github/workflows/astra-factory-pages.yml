name: Astra Factory UI Preview Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-factory-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: astra-factory-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified preview payload
        uses: actions/checkout@v4
        with:
          ref: astra-factory-preview

      - name: Materialize minimal site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/src
          cp index.html styles.css _site/
          cp src/app.js src/actions.js src/state.js _site/src/
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/src/app.js
          echo 'SITE_PAYLOAD=VERIFIED'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
