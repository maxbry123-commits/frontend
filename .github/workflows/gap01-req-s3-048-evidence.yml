name: GAP01 REQ-S3-048 Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gap01-req-s3-048-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_memory_context_fabric.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Exact hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES'
          echo "revision=$GITHUB_SHA"
          sha256sum "$ROOT/runtime/src/memory/fabric.py"
          sha256sum "$ROOT/runtime/tests/test_memory_context_fabric.py"
          sha256sum "$ROOT/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md"
      - name: Focused REQ-S3-048 regression
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          python -m pytest -q tests/test_memory_context_fabric.py
