name: XRAY-11 Motor3 Materialize
on:
  push:
    branches: [main]
    paths: ['.github/workflows/xray-11-motor3-materialize.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xray-11-motor3-materialize
  cancel-in-progress: false
jobs:
  copy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, lfs: false}
      - name: Copy approved 4 with canonical Motor3
        shell: bash
        run: |
          set -euo pipefail
          SRC='UI YAIWES/componentes open soure UI YAIWES/user-requested-workflow-2026-09-17'
          DST='UI YAIWES interface/Backend/Motor3 approved donors'
          MOTOR='UI YAIWES/➡️📂motores de descarga extracción copiado movimiento archivos frontend/➡️📂motor de copiar archivos/motor_3_copy_batches.py'
          for c in Codebase-Memory-MCP OmniRoute Orca Omarchy; do
            test -d "$SRC/$c"
            SOURCE_DIR="$SRC/$c" DEST_DIR="$DST/$c" STATE_FILE="$RUNNER_TEMP/$c-state.json" BATCH_SIZE=100 COLLISION_POLICY=fail python3 "$MOTOR"
            python3 - "$SRC/$c" "$DST/$c/SOURCE_SHA256SUMS.txt" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          rows = []
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'SOURCE_SHA256SUMS.txt'):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              rows.append(f"{h.hexdigest()}  {p.relative_to(root).as_posix()}")
          if not rows:
              raise SystemExit('EMPTY_SOURCE')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'PROVENANCE_MANIFEST_OK files={len(rows)}')
          PY
          done
          test ! -e "$DST/Anydoc"
          git add "$DST"
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'xray11: Motor3 copy four approved donors (Anydoc excluded)'
            git push origin HEAD:main
          fi
      - name: Independent hash readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          SRC='UI YAIWES/componentes open soure UI YAIWES/user-requested-workflow-2026-09-17'
          DST='UI YAIWES interface/Backend/Motor3 approved donors'
          for c in Codebase-Memory-MCP OmniRoute Orca Omarchy; do
            test -d "$DST/$c"
            test -s "$DST/$c/SOURCE_SHA256SUMS.txt"
            python3 - "$SRC/$c" "$DST/$c" <<'PY'
          import hashlib, pathlib, sys
          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          manifest = dst / 'SOURCE_SHA256SUMS.txt'
          expected = {}
          for raw in manifest.read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  digest, rel = raw.split(None, 1)
                  expected[rel.lstrip('*')] = digest.lower()
          actual_paths = {p.relative_to(src).as_posix() for p in src.rglob('*') if p.is_file() and p.name != 'SOURCE_SHA256SUMS.txt'}
          if set(expected) != actual_paths:
              raise SystemExit(f'MANIFEST_SET_MISMATCH expected={len(expected)} source={len(actual_paths)}')
          for rel, digest in expected.items():
              sp, dp = src / rel, dst / rel
              if not dp.is_file():
                  raise SystemExit(f'MISSING_DEST: {rel}')
              def sha(p):
                  h = hashlib.sha256()
                  with p.open('rb') as f:
                      for chunk in iter(lambda: f.read(1024 * 1024), b''):
                          h.update(chunk)
                  return h.hexdigest().lower()
              sh, dh = sha(sp), sha(dp)
              if sh != digest or dh != digest:
                  raise SystemExit(f'HASH_MISMATCH: {rel}')
          print(f'HASH_READBACK_OK files={len(expected)}')
          PY
          done
          test ! -e "$DST/Anydoc"
          echo 'XRAY-11 MOTOR3 4/4 HASH READBACK PASS; Anydoc excluded'
