name: Copy frontend and Code documents from trabajo-grok

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v6
        with:
          path: destination

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: maxbry123-commits/trabajo-grok
          ref: main
          path: source

      - name: Copy eligible root documents without replacing destination files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            if [[ "$name" =~ FROMTED|LEY-CODIGO|CHAT|CODE|FRONTEND ]] || grep -Eiq 'frontend|fronted|react|vite|assistant-ui|OpenClaw|\bcode\b|\bcódigo\b|UI' "$f"; then
              target="destination/$name"
              if [[ ! -e "$target" ]]; then
                cp -p "$f" "$target"
                echo "COPIED $name"
              else
                echo "SKIP_EXISTING $name"
              fi
            fi
          done < <(find source -maxdepth 1 -type f -name '*.md' -print0)

      - name: Commit only newly copied documents
        working-directory: destination
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo 'NO_NEW_FILES'
            exit 0
          fi
          git commit -m 'Copy Code and frontend documents from trabajo-grok [skip ci]'
          git push

