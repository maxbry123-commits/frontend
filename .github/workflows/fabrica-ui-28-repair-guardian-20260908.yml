name: Fabrica UI 28 Repair Guardian
run-name: Fabrica UI 28 Repair Guardian • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fabrica-ui-28-repair-guardian-20260908
  cancel-in-progress: false

jobs:
  repair-only-if-gaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NO-LFS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Count only missing or unverifiable source trees
        id: gaps
        shell: bash
        run: |
          set -euo pipefail
          Q='scripts/fabrica-ui-28-download-extract-20260908/QUEUE.json'
          ROOT='fabrica de UI INTERFACE fromtend'
          python3 - "$Q" "$ROOT" "$GITHUB_OUTPUT" <<'PY'
          import json,pathlib,sys
          q=json.load(open(sys.argv[1],encoding='utf-8')); root=pathlib.Path(sys.argv[2]); gaps=[]
          for c in q['components']:
              d=root/c['slug']; reasons=[]
              if not d.is_dir(): reasons.append('DESTINATION_MISSING')
              for f in ('SOURCE_URL.txt','SOURCE_COMMIT.txt','SOURCE_SHA256SUMS.txt'):
                  if d.is_dir() and not (d/f).is_file(): reasons.append('TRACE_MISSING:'+f)
              if reasons: gaps.append({'slug':c['slug'],'reasons':reasons})
          print(json.dumps({'remaining_gaps':len(gaps),'gaps':gaps},ensure_ascii=False))
          with open(sys.argv[3],'a') as f: f.write('count='+str(len(gaps))+'\n')
          PY
      - name: Dispatch producer only when gaps remain
        if: steps.gaps.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/fabrica-ui-28-download-extract-20260908.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'REPAIR_DISPATCHED_FOR_REMAINING_GAPS'
      - name: No-op when complete
        if: steps.gaps.outputs.count == '0'
        run: echo 'NO_GAPS_NO_REPAIR'
