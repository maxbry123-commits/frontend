name: SOL GPT3 S3 Pending Vendor Tests

on:
  push:
    paths:
      - '.github/workflows/sol-gpt3-s3-vendor-tests-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-gpt3-s3-vendor-tests-20260911
  cancel-in-progress: false

jobs:
  big-agi-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout big-AGI source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/big-AGI/code
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'UI YAIWES/componentes open soure UI YAIWES/big-AGI/code/package-lock.json'

      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/big-AGI/code'
        run: npm ci

      - name: Run upstream production build
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/big-AGI/code'
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_DEPLOYMENT_TYPE: docker
        run: npm run build

  vercel-ai-sdk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Vercel AI SDK source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.6.2 --activate
          pnpm --version

      - name: Install locked workspace dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code'
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Run upstream AI package tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code'
        run: pnpm test --filter=ai...

  vercel-stream-lifecycle-no-force-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Vercel AI SDK source only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.6.2 --activate
          pnpm --version

      - name: Install locked workspace dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code'
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: Patch test harness to await HTTP server shutdown
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('packages/core/tests/utils/mock-service.ts')
          text = service.read_text()
          old = """    teardown: () => {
                server.close()
              },"""
          new = """    teardown: () =>
                new Promise<void>((resolve, reject) => {
                  server.close(error => (error ? reject(error) : resolve()))
                }),"""
          if old not in text:
              raise SystemExit('mock-service teardown pattern not found')
          service.write_text(text.replace(old, new, 1))

          test = Path('packages/core/streams/index.test.ts')
          text = test.read_text()
          old = """  afterAll(() => {
              server.teardown()
            })"""
          new = """  afterAll(async () => {
              await server.teardown()
            })"""
          if old not in text:
              raise SystemExit('afterAll pattern not found')
          test.write_text(text.replace(old, new, 1))
          PY
          git diff -- packages/core/tests/utils/mock-service.ts packages/core/streams/index.test.ts

      - name: Node stream cancel clean-exit gate
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code/packages/core'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec jest streams/index.test.ts --env node --detectOpenHandles --runInBand 2>&1 | tee "$RUNNER_TEMP/vercel-node-lifecycle.log"
          if grep -qi 'open handle' "$RUNNER_TEMP/vercel-node-lifecycle.log"; then
            echo 'OPEN_HANDLE_GAP_NODE'
            exit 1
          fi

      - name: Edge stream cancel clean-exit gate
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Vercel AI SDK/code/packages/core'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec jest streams/index.test.ts --env @edge-runtime/jest-environment --detectOpenHandles --runInBand 2>&1 | tee "$RUNNER_TEMP/vercel-edge-lifecycle.log"
          if grep -qi 'open handle' "$RUNNER_TEMP/vercel-edge-lifecycle.log"; then
            echo 'OPEN_HANDLE_GAP_EDGE'
            exit 1
          fi
