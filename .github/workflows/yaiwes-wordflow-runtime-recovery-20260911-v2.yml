name: YAIWES Wordflow Runtime Recovery V2

on:
  pull_request:
    paths:
      - 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop/**'
      - '.github/workflows/yaiwes-wordflow-runtime-recovery-20260911-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yaiwes-wordflow-runtime-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and pytest
        working-directory: UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop
        run: python -m pip install -e . pytest
      - name: Run runtime tests
        working-directory: UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/wordflow_loop
        run: pytest -q
