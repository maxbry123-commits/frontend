name: UI YAIWES 43 Repair 02 Skill
run-name: UI YAIWES 43 Repair 02 Skill • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-yaiwes-43-repair-02-skill-20260908.yml'

permissions:
  contents: write
  actions: read

env:
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: frontend-ui-yaiwes-43-full-repo-reentry-repair-01-git-identity-20260908
  cancel-in-progress: false

jobs:
  repair-02-single-writer:
    name: Repair only uncertified 43-reentry components with exact staged bytes
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout destination main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Refresh snapshot after serialized predecessor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Apply immutable NO-LFS policy
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          git config --local core.compression 0

      - name: Execute repair-02 from skill rules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ui_yaiwes_43_repair_02_skill_20260908.py

      - name: Repair-02 checkpoint summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main || true
          p='UI YAIWES/componentes open soure UI YAIWES/REENTRY_43_REPAIR_02_CHECKPOINT.json'
          git show "origin/main:$p" 2>/dev/null || echo 'REPAIR_02_CHECKPOINT_NOT_YET_PUBLISHED'
