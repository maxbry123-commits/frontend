name: GAP02 REQ-S3-047 Evidence V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gap02-req-s3-047-evidence-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/audit
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/coverage
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/memory/boundary.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_memory_boundary.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_coverage_production_trace.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/requirement_traces/REQ-S3-047.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/evidence/requirement_traces/REQ-S3-047.ci.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Exact hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES'
          echo "revision=$GITHUB_SHA"
          sha256sum "$ROOT/runtime/src/memory/boundary.py"
          sha256sum "$ROOT/runtime/tests/test_memory_boundary.py"
          sha256sum "$ROOT/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md"
      - name: Focused REQ-S3-047 regression
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m unittest -v tests.test_memory_boundary.MemoryBoundaryTests.test_direct_llm_canonical_write_is_rejected
      - name: Focused REQ-S3-047 five-pass
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m pytest -q tests/test_coverage_production_trace.py::test_memory_write_gate_trace_rejects_direct_llm_persistence_and_real_ci
