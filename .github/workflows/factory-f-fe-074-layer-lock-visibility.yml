name: factory-f-fe-074-layer-lock-visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-f-fe-074-layer-lock-visibility.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/layer-reorder-v2.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-fe-074-layer-lock-visibility.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-f-fe-074-layer-lock-visibility
  cancel-in-progress: false

jobs:
  layer-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve prior layer-reorder v1
        run: |
          set -euo pipefail
          test -s src/layer-reorder-v1.js
          test -s src/layer-reorder-v2.js
          grep -F "__YAIWES_LAYER_REORDER_API_V1__" src/layer-reorder-v1.js
          grep -F "LAYER_REORDER_VERSION = '2.0.0'" src/layer-reorder-v2.js
          ! grep -F "LAYER_REORDER_VERSION = '2.0.0'" src/layer-reorder-v1.js
          git hash-object src/layer-reorder-v1.js
          git hash-object src/layer-reorder-v2.js
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax F-FE-074
        run: |
          node --check src/layer-reorder-v2.js
          node --check tests/e2e/f-fe-074-layer-lock-visibility.spec.mjs
      - name: F-FE-074 desktop layer lock/visibility
        run: npx playwright test tests/e2e/f-fe-074-layer-lock-visibility.spec.mjs --project=chromium-desktop --reporter=line
      - name: F-FE-074 Pixel 7 layer lock/visibility
        run: npx playwright test tests/e2e/f-fe-074-layer-lock-visibility.spec.mjs --project=mobile-chromium --reporter=line
      - name: Preserve F-FE-074 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-f-fe-074-layer-lock-visibility-evidence
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results
          if-no-files-found: warn
          retention-days: 14
