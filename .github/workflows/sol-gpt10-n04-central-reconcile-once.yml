name: SOL GPT 10 N04 central reconcile once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sol-gpt10-n04-central-reconcile-once.yml'

permissions:
  contents: write

concurrency:
  group: sol-gpt10-n04-central-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile verified stale rows fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          nodes = {n['id']: n for n in data['nodes']}

          expected = {
              'N04-STATE-RECONCILIATION': 'FREE',
              'N16-CHECKPOINT-BYTES-HASH': 'GAP_RESOLVABLE',
              'N26-GLOBAL-INTEGRATION': 'GAP_RESOLVABLE',
              'N28-API-CONTROL': 'GAP_RESOLVABLE',
              'N33-MIRROR-TRANSPORT-CONTROL': 'GAP_RESOLVABLE',
          }
          for node_id, state in expected.items():
              actual = nodes[node_id]['state']
              if actual != state:
                  raise SystemExit(f'FAIL_CLOSED stale precondition {node_id}: expected {state}, got {actual}')

          # N16: exact current blobs + trusted descendant CI run 34739510224/job 103678337638.
          n16 = nodes['N16-CHECKPOINT-BYTES-HASH']
          n16.update({
              'state': 'VERIFIED_CLOSED',
              'report_state': 'PASS_RECONCILED_FROM_TRUSTED_DESCENDANT_CI',
              'tests': 'specific 7/7 PASS; trusted descendant CI run 34739510224 job 103678337638 SUCCESS: Wordflow 41/41 PASS; runtime 206/206 PASS + 39 subtests PASS',
              'run_id': 34739510224,
              'job_id': 103678337638,
              'remaining_gaps': [],
              'reconciled_evidence_commit': 'b5dc2a8e832c97f9d935b4a1db0087b249955d5a',
          })
          n16.setdefault('evidence', []).append('SOL GPT <10> R2 exact current blobs matched registered N16 hashes and implementation commit f7e9af7 is ancestor of successful CI head cf40e9c.')

          # N26: SOL GPT <15> report is VERIFIED_CLOSED with exact blobs and trusted CI.
          n26 = nodes['N26-GLOBAL-INTEGRATION']
          n26.update({
              'state': 'VERIFIED_CLOSED',
              'owner': 'SOL GPT <15>',
              'chat_id': 'SOL GPT <15>',
              'report_state': 'PASS_RECONCILED_FROM_TRUSTED_SWARM_EVIDENCE',
              'tests': 'trusted descendant CI run 34739510224 job 103678337638 SUCCESS; exact integration_state.py/test blobs match certified revision',
              'run_id': 34739510224,
              'job_id': 103678337638,
              'remaining_gaps': [],
              'reconciled_evidence_commit': 'b645e2b714d05bdcc0b6046c65dd9449e08b9524',
          })
          n26.setdefault('evidence', []).append('SOL GPT <15> report pass_percent=100; no N26 code/test drift after trusted CI revision cf40e9c.')

          # N28: SOL GPT <16> report has all three refutations PASS and close_candidate VERIFIED_CLOSED.
          n28 = nodes['N28-API-CONTROL']
          n28.update({
              'state': 'VERIFIED_CLOSED',
              'owner': 'SOL GPT <16>',
              'chat_id': 'SOL GPT <16>',
              'report_state': 'PASS_RECONCILED_FROM_TRUSTED_SWARM_EVIDENCE',
              'tests': 'trusted descendant CI run 34739510224 job 103678337638 SUCCESS: Wordflow 41/41 PASS; runtime 206/206 PASS + 39 subtests PASS; exact API/control blobs match',
              'run_id': 34739510224,
              'job_id': 103678337638,
              'remaining_gaps': [],
              'reconciled_evidence_commit': '0bda3cd116a3b30a71dea3a147179aaa620562c5',
          })
          n28.setdefault('evidence', []).append('SOL GPT <16> report: schema_complete PASS, remaining_technical_gap PASS_NONE, evidence_100_pass PASS with exact current blobs.')

          # N33: corrected descendant evidence from SOL GPT <17>; ownership remains prior SOL GPT <13>.
          n33 = nodes['N33-MIRROR-TRANSPORT-CONTROL']
          n33.update({
              'state': 'VERIFIED_CLOSED',
              'owner': 'SOL GPT <13>',
              'chat_id': 'SOL GPT <13>',
              'report_state': 'PASS_RECONCILED_FROM_CORRECTED_DESCENDANT_CI',
              'tests': 'authoritative descendant CI run 34743651221 job 103687583217 SUCCESS: Wordflow 41/41 PASS; runtime 256/256 PASS + 42 subtests PASS',
              'run_id': 34743651221,
              'job_id': 103687583217,
              'remaining_gaps': [],
              'reconciled_evidence_commit': '31d1531f07c0c3c377901dc2b21a8d404cf204ed',
          })
          n33['evidence'] = [
              'implementation f8477f0791b18aa249352085e2eaea910860ec9a + tests 26ec8170efe5573dcd88e54f18683b3900dc6aa1 certified by descendant 13418e0dd9d73d2070497b9485757d098cbed0e8',
              'transport.py blob a7fb9e9b1584f403215e0976a81a137785fd68a6 and test blob dcb930555164e2f17f04aafd11494b9850062242 exact',
              'pairing/auth/LAN boundary fail closed; display/audio/input/clipboard/control allowed; disk/ram/memory/filesystem rejected',
              'SOL GPT <17> corrected the earlier invalid pre-N33 CI evidence and released its duplicate claim',
          ]

          # Derived unlocks only after exact dependencies are closed.
          n27 = nodes['N27-CONTINUOUS-LOOP']
          if all(nodes[d]['state'] == 'VERIFIED_CLOSED' for d in n27['depends_on']):
              n27['state'] = 'FREE'
              n27['reconciled_reason'] = 'N26+N23 dependencies VERIFIED_CLOSED'

          n17 = nodes['N17-FULL-PRODUCT-E2E']
          if all(nodes[d]['state'] == 'VERIFIED_CLOSED' for d in n17['depends_on']):
              n17['state'] = 'FREE'
              n17['reconciled_reason'] = 'N18+N20+N26+N28+N29 dependencies VERIFIED_CLOSED'

          # N04 closes only after all state reconciliation above is internally consistent.
          n04 = nodes['N04-STATE-RECONCILIATION']
          n04.update({
              'state': 'VERIFIED_CLOSED',
              'owner': 'SOL GPT <10>',
              'chat_id': 'SOL GPT <10>',
              'node_id': 'N04-STATE-RECONCILIATION',
              'fresh_main_sha': '48b22db7653eb3d25a0e58865cb0ef8d2994f606',
              'write_scope': 'shared state docs only',
              'claimed_at': '2026-09-13T07:12:00Z',
              'reported_at': '2026-09-13T07:13:00Z',
              'report_state': 'PASS_RECONCILED_CENTRAL_STATE',
              'paths_changed': [
                  'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json',
                  'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/STATE.json',
                  'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CHECKPOINT.json',
                  'UI YAIWES/readme arquitectura UI YAIWES/HANDOFF-DYNAMIC-NODES-UI-YAIWES-V8-2026-09-12.md',
              ],
              'tests': 'JSON parse + strict stale-state preconditions + dependency unlock assertions; readback required after commit',
              'remaining_gaps': [],
              'reconciled_evidence_commit': 'f69b7a1aac506285496d88a11cfae01ad367f842',
          })
          n04['evidence'] = [
              'N02 and N03 VERIFIED_CLOSED',
              'STATE/CHECKPOINT/Handoff were refreshed by SOL GPT <10> and preserve history by Git blob SHA',
              'N16/N26/N28/N33 stale central rows reconciled only from independently verified reports/CI',
              'N27/N17 unlocked only by dependency-state predicates, never by manual bypass',
          ]

          # Postconditions.
          for node_id in ('N04-STATE-RECONCILIATION','N16-CHECKPOINT-BYTES-HASH','N26-GLOBAL-INTEGRATION','N28-API-CONTROL','N33-MIRROR-TRANSPORT-CONTROL'):
              assert nodes[node_id]['state'] == 'VERIFIED_CLOSED', node_id
          assert nodes['N27-CONTINUOUS-LOOP']['state'] == 'FREE'
          assert nodes['N17-FULL-PRODUCT-E2E']['state'] == 'FREE'

          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          # Parse the bytes we will commit one more time.
          json.loads(p.read_text(encoding='utf-8'))
          print('N04_RECONCILE_PASS', {k: nodes[k]['state'] for k in ('N04-STATE-RECONCILIATION','N16-CHECKPOINT-BYTES-HASH','N17-FULL-PRODUCT-E2E','N26-GLOBAL-INTEGRATION','N27-CONTINUOUS-LOOP','N28-API-CONTROL','N33-MIRROR-TRANSPORT-CONTROL')})
          PY
          git diff --check
          git diff -- 'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json'
          git config user.name 'SOL GPT 10'
          git config user.email 'actions@users.noreply.github.com'
          git add 'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json'
          git commit -m 'reconcile(n04): atomically close verified stale rows and unlock dependencies'
          git push origin HEAD:main
