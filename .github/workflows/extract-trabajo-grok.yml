name: Extract Trabajo de grock ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'Extract Trabajo de grock ZIP') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract ZIP into one root
        shell: bash
        run: |
          set -euo pipefail
          test -f trabajo-grok-main.zip
          rm -rf 'Trabajo de grock' /tmp/trabajo-grok-extract
          mkdir -p 'Trabajo de grock' /tmp/trabajo-grok-extract
          unzip -q trabajo-grok-main.zip -d /tmp/trabajo-grok-extract

          top_count=$(find /tmp/trabajo-grok-extract -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$top_count" -eq 1 ] && [ -d "$(find /tmp/trabajo-grok-extract -mindepth 1 -maxdepth 1 -type d | head -n1)" ]; then
            root_dir=$(find /tmp/trabajo-grok-extract -mindepth 1 -maxdepth 1 -type d | head -n1)
            cp -a "$root_dir"/. 'Trabajo de grock/'
          else
            cp -a /tmp/trabajo-grok-extract/. 'Trabajo de grock/'
          fi

          test -n "$(find 'Trabajo de grock' -mindepth 1 -print -quit)"

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Trabajo de grock/'
          git diff --cached --quiet && exit 0
          git commit -m 'Extract Trabajo de grock ZIP'
          git push
