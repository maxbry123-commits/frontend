name: Factory F-AI-020 Remote Connections Gate

on:
  push:
    branches: [main]
    paths:
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/remote-control-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/index-v19.html'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-ai-020-remote-connections.spec.mjs'
      - '.github/workflows/factory-f-ai-020-remote-connections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-connect-status-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Factory subtree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static syntax check
        working-directory: 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0'
        run: |
          node --check src/remote-control-v1.js
          node --check tests/e2e/f-ai-020-remote-connections.spec.mjs
      - name: Run connect status cancel gate
        working-directory: 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0'
        run: node tests/e2e/f-ai-020-remote-connections.spec.mjs
