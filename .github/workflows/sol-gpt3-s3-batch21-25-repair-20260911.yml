name: SOL GPT3 S3 Batch 21 22 25 Repair

on:
  push:
    paths:
      - '.github/workflows/sol-gpt3-s3-batch21-25-repair-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-gpt3-s3-batch21-25-repair-20260911
  cancel-in-progress: false

jobs:
  tanstack-query-local-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/TanStack Query/code
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/TanStack Query/code'
        run: pnpm install --frozen-lockfile
      - name: Run upstream CI tests without remote Nx Cloud
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/TanStack Query/code'
        env:
          NX_NO_CLOUD: 'true'
          NX_CLOUD: 'false'
        run: pnpm test:ci

  react-virtuoso-upstream-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.24.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code'
        env:
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Build upstream prerequisites
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code'
        run: pnpm --filter '!@virtuoso.dev/virtuoso.dev' build
      - name: Install Chromium for gurx upstream tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code'
        run: pnpm --filter @virtuoso.dev/gurx exec playwright install --with-deps chromium
      - name: Run upstream tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code'
        run: pnpm test

  tailwind-css-upstream-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Setup WASM target
        run: rustup target add wasm32-wasip1-threads
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS'
        run: pnpm install --frozen-lockfile
      - name: Build upstream native and JS prerequisites
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
        run: pnpm run build
      - name: Run upstream Rust and Vitest suite
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS'
        run: pnpm run test
