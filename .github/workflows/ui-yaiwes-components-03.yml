name: UI YAIWES frontend components 3
on:
  pull_request_target:
    paths: [ui-yaiwes-components-trigger.txt]
permissions:
  contents: write
concurrency:
  group: research-download-chain-final
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/research_download_ui_yaiwes_03.py
            📂componentes open soure fromtend/UI YAIWES/RESEARCH_DOWNLOAD_MANIFEST.jsonl
          sparse-checkout-cone-mode: false
      - run: python3 scripts/research_download_ui_yaiwes_03.py "📂componentes open soure fromtend/UI YAIWES" "_work/ui-yaiwes-03"
