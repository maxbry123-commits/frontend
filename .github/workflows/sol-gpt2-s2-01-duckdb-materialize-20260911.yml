name: SOL 3 GPT N30 G12 Coverage Audit

on:
  push:
    paths:
      - '.github/workflows/sol-gpt2-s2-01-duckdb-materialize-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n30-g12-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch authoritative N30 audit inputs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q
          git remote add origin 'https://github.com/maxbry123-commits/frontend.git'
          git sparse-checkout init --no-cone
          cat > .git/info/sparse-checkout <<'EOF'
          /UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json
          /UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/reports/N02-TRACEABILITY-BIDIRECTIONAL-SOL-8-GPT-2026-09-13.json
          /UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/audit/
          /UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_audit_evidence_matrix.py
          EOF
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 --filter=blob:none origin main
          git checkout -q -B audit-main FETCH_HEAD
          git rev-parse HEAD | tee "$RUNNER_TEMP/n30-base-main.txt"

      - name: Execute canonical five-pass denominator audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, sys
          from collections import Counter, defaultdict

          root = pathlib.Path.cwd()
          n02_path = root / 'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/reports/N02-TRACEABILITY-BIDIRECTIONAL-SOL-8-GPT-2026-09-13.json'
          cw_path = root / 'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json'
          audit_root = root / 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/audit'
          test_matrix = root / 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_audit_evidence_matrix.py'
          n02 = json.loads(n02_path.read_text())
          cw = json.loads(cw_path.read_text())

          rows = n02['requirement_rows']
          impl = [r for r in rows if r['implementable']]
          nonimpl = [r['requirement_id'] for r in rows if not r['implementable']]
          assert len(rows) == 100, len(rows)
          assert len({r['requirement_id'] for r in rows}) == 100
          assert len(impl) == 98, len(impl)
          assert nonimpl == ['REQ-S2-011', 'REQ-S3-062'], nonimpl
          assert not [r for r in impl if not r.get('canonical_id')]
          assert len({r['canonical_id'] for r in impl}) == 34

          by_id = {n['id']: n for n in cw['nodes']}
          n30 = by_id['N30-G12-GLOBAL-COVERAGE']
          assert n30['state'] == 'CLAIMED' and n30['owner'] == 'sol 3 gpt' and n30['chat_id'] == 'sol 3 gpt', n30

          audit_files = sorted(p.name for p in audit_root.iterdir() if p.is_file())
          assert audit_files == ['evidence.py', 'five_pass.py', 'matrix.py'], audit_files
          matrix_test = test_matrix.read_text()
          assert 'RequirementMatrix(("R1",)' in matrix_test
          assert 'RequirementMatrix(("R1", "R2")' in matrix_test
          assert 'REQ-S1-' not in matrix_test and 'REQ-S2-' not in matrix_test and 'REQ-S3-' not in matrix_test

          sys.path.insert(0, str(audit_root.parent))
          from audit.five_pass import audit_five_pass
          expected = tuple(r['requirement_id'] for r in impl)
          result = audit_five_pass(
              root=root,
              expected_requirements=expected,
              traces=(),
              artifacts=(),
              verify_execution=lambda *_: (_ for _ in ()).throw(AssertionError('must not be called without production traces')),
          )
          missing = sorted(g for g in result.gaps if g.endswith(':missing_trace'))
          assert result.status == 'GAP', result
          assert result.verified_requirements == 0, result
          assert result.total_requirements == 98, result
          assert result.coverage_percent == 0.0, result
          assert len(missing) == 98, len(missing)
          assert {x.split(':',1)[0] for x in missing} == set(expected)
          assert len(result.gaps) == 98, result.gaps

          grouped = defaultdict(list)
          for row in impl:
              grouped[row['canonical_id']].append(row['requirement_id'])
          grouped = {k: sorted(v) for k,v in sorted(grouped.items())}
          states = Counter(n['state'] for n in cw['nodes'])
          active_or_residual = {
              n['id']: {'state': n['state'], 'owner': n.get('owner')}
              for n in cw['nodes']
              if n['state'] != 'VERIFIED_CLOSED'
          }
          summary = {
              'schema': 'yaiwes.audit.n30.g12-runtime-check.v1',
              'base_main_sha': pathlib.Path('/tmp').joinpath('none').name,
              'source_anchor_rows': 100,
              'implementable_requirements': 98,
              'non_implementable_source_numbering_gaps': nonimpl,
              'trace_mapping': {'mapped': 98, 'total': 98, 'percent': 100.0},
              'canonical_five_pass_certification': {
                  'verified_requirements': result.verified_requirements,
                  'total_requirements': result.total_requirements,
                  'percent': result.coverage_percent,
                  'reason': 'No production RequirementTrace inventory binds the 98 N02 requirements to exact source/code/test/evidence/revision; canonical audit package contains only engine modules and existing matrix tests are synthetic R1/R2 fixtures.'
              },
              'residual_requirement_count': len(missing),
              'residual_requirements_by_canonical_id': grouped,
              'node_state_counts': dict(sorted(states.items())),
              'non_closed_nodes': active_or_residual,
              'global_project_verified_closed': False,
              'n30_audit_result': 'PASS_EXACT_RESIDUAL_LIST',
          }
          summary['base_main_sha'] = pathlib.Path(__import__('os').environ['RUNNER_TEMP'], 'n30-base-main.txt').read_text().strip()
          out = pathlib.Path(__import__('os').environ['RUNNER_TEMP'], 'n30-audit-summary.json')
          out.write_text(json.dumps(summary, indent=2, ensure_ascii=False, sort_keys=True) + '\n')
          print(out.read_text())
          PY

      - name: Refute accidental product closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'],'n30-audit-summary.json')
          x=json.loads(p.read_text())
          assert x['trace_mapping']['percent'] == 100.0
          assert x['canonical_five_pass_certification']['percent'] == 0.0
          assert x['residual_requirement_count'] == 98
          assert x['global_project_verified_closed'] is False
          assert x['n30_audit_result'] == 'PASS_EXACT_RESIDUAL_LIST'
          print(json.dumps({'refutation_1_denominator_complete':True,'refutation_2_no_unproven_promotion':True,'refutation_3_exact_98_residuals':True},sort_keys=True))
          PY
