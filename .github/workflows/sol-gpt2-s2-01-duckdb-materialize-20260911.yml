name: SOL 3 GPT N21 Claim Transaction

on:
  push:
    paths:
      - '.github/workflows/sol-gpt2-s2-01-duckdb-materialize-20260911.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-3-gpt-n21-claim-transaction
  cancel-in-progress: false

jobs:
  claim-n21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Claim N21 from fresh main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: maxbry123-commits/frontend
          CW_PATH: UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          pushed=0
          for attempt in 1 2 3 4 5; do
            WORK="$RUNNER_TEMP/n21-claim-$attempt"
            rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"
            git init -q
            git remote add origin "https://github.com/$REPO.git"
            git sparse-checkout init --no-cone
            printf '/%s\n' "$CW_PATH" > .git/info/sparse-checkout
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 --filter=blob:none origin main
            git checkout -q -B main FETCH_HEAD
            export FRESH_MAIN_SHA="$(git rev-parse HEAD)"
            export CLAIMED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['CW_PATH'])
          text=p.read_text(); doc=json.loads(text); by_id={n['id']:n for n in doc['nodes']}
          n20=by_id['N20-SANDBOX-UEK-ROUTER']; n21=by_id['N21-WORKER-ADAPTER']
          assert n20['state']=='VERIFIED_CLOSED', n20
          assert n21['state'] in set(doc['coordination']['claim_states']), n21
          assert n21['state']=='FREE' and n21.get('owner') is None, n21
          n21.update({
            'state':'CLAIMED',
            'owner':'sol 3 gpt',
            'chat_id':'sol 3 gpt',
            'node_id':'N21-WORKER-ADAPTER',
            'fresh_main_sha':os.environ['FRESH_MAIN_SHA'],
            'write_scope':n21['scope'],
            'claimed_at':os.environ['CLAIMED_AT']
          })
          lines=text.splitlines(); seen=False
          for i,line in enumerate(lines):
            if '"id":"N21-WORKER-ADAPTER"' in line:
              indent=line[:len(line)-len(line.lstrip())]
              comma=',' if line.rstrip().endswith(',') else ''
              lines[i]=indent+json.dumps(n21,ensure_ascii=False,separators=(',',':'))+comma
              seen=True; break
          assert seen
          patched='\n'.join(lines)+'\n'; chk=json.loads(patched); x={n['id']:n for n in chk['nodes']}['N21-WORKER-ADAPTER']
          assert x['state']=='CLAIMED' and x['owner']=='sol 3 gpt' and x['fresh_main_sha']==os.environ['FRESH_MAIN_SHA']
          p.write_text(patched)
          print(json.dumps({'fresh_main_sha':os.environ['FRESH_MAIN_SHA'],'node':'N21-WORKER-ADAPTER','state':'CLAIMED','claimed_at':os.environ['CLAIMED_AT']},sort_keys=True))
          PY
            git config user.name 'sol-3-gpt-yaiwes'
            git config user.email 'sol-3-gpt-yaiwes@users.noreply.github.com'
            git add -- "$CW_PATH"
            changed="$(git -c core.quotepath=false diff --cached --name-only)"
            test "$changed" = "$CW_PATH"
            git commit -m 'claim(n21): sol 3 gpt worker adapter'
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main; then
              pushed=1
              git rev-parse HEAD | tee "$RUNNER_TEMP/n21-claim-commit.txt"
              break
            fi
            echo 'main moved; retrying fresh without force'
          done
          test "$pushed" = '1'

      - name: Read back N21 claim
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: maxbry123-commits/frontend
          CW_PATH: UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git init -q "$RUNNER_TEMP/rb" && cd "$RUNNER_TEMP/rb"
          git remote add origin "https://github.com/$REPO.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin main
          git show FETCH_HEAD:"$CW_PATH" > "$RUNNER_TEMP/cw.json"
          export READBACK_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          python - <<'PY'
          import json,os,pathlib
          doc=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'cw.json').read_text()); n={x['id']:x for x in doc['nodes']}['N21-WORKER-ADAPTER']
          assert n['state']=='CLAIMED' and n['owner']=='sol 3 gpt' and n['chat_id']=='sol 3 gpt'
          print(json.dumps({'main_sha':os.environ['READBACK_MAIN_SHA'],'node':n['id'],'state':n['state'],'owner':n['owner'],'fresh_main_sha':n['fresh_main_sha']},sort_keys=True))
          PY
