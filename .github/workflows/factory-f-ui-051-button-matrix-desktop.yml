name: Factory F-UI-051 Desktop Button Matrix
on:
  push:
    branches: [main]
    paths:
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-ui-051-button-matrix-desktop.spec.mjs'
      - '.github/workflows/factory-f-ui-051-button-matrix-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-button-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax
        run: node --check tests/e2e/f-ui-051-button-matrix-desktop.spec.mjs
      - name: Desktop control discovery and baseline effects
        run: npx playwright test tests/e2e/f-ui-051-button-matrix-desktop.spec.mjs --project=chromium-desktop --reporter=line
      - name: Preserve matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ui-051-desktop-button-matrix-evidence
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results/f-ui-051
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report
          if-no-files-found: warn
          retention-days: 14
