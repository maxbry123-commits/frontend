name: Motor G3 Clean Refs 2 20260910
run-name: Motor G3 Clean Refs 2 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motor-g3-cleanrefs-2-20260910.yml'

permissions:
  contents: write

concurrency:
  group: motor-g3-cleanrefs-2-20260910
  cancel-in-progress: false

jobs:
  motor-g3-cleanrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout canonical motor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            ➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip
          sparse-checkout-cone-mode: false
      - name: Verify canonical motor blobs
        shell: bash
        run: |
          set -euo pipefail
          MOTOR_DIR='➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip'
          test "$(git hash-object "$MOTOR_DIR/motor_2_queue_download_extract.py")" = '84d566e2ee4e98e42eb3a864026d067d48caabd9'
          test "$(git hash-object "$MOTOR_DIR/hf_download_extract_engine.py")" = '91e6e4486692eab314be5c7130d8310d3c855397'
      - name: Execute clean official refs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEST_REPO: maxbry123-commits/frontend
          DEST_BRANCH: main
          DEST_ROOT: UI YAIWES/watchdog UI YAIWES/Download librerías
          MAX_RETRIES: '3'
        run: |
          set -euo pipefail
          MOTOR_DIR="$GITHUB_WORKSPACE/➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip"
          export ENGINE_PATH="$MOTOR_DIR/hf_download_extract_engine.py"
          export QUEUE_FILE="$RUNNER_TEMP/g3-cleanrefs.queue.json"
          export STATE_FILE="$RUNNER_TEMP/g3-cleanrefs.state.json"
          export INDEX_PATH="$RUNNER_TEMP/g3-cleanrefs.index.md"
          cat > "$QUEUE_FILE" <<'JSON'
          {"queue":[
            {"id":"g3-ref-pydantic","source_repo":"pydantic/pydantic","source_ref":"v2.13.5","slug":"Pydantic","publish":true},
            {"id":"g3-ref-voluptuous","source_repo":"alecthomas/voluptuous","source_ref":"0.14.2","slug":"Voluptuous","publish":true}
          ]}
          JSON
          python3 "$MOTOR_DIR/motor_2_queue_download_extract.py" | tee "$RUNNER_TEMP/g3-cleanrefs.result.jsonl"
          cat "$STATE_FILE"
          tail -n 1 "$RUNNER_TEMP/g3-cleanrefs.result.jsonl" > "$RUNNER_TEMP/g3-cleanrefs.final.json"
          python3 - "$RUNNER_TEMP/g3-cleanrefs.final.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          b=p.get('balance',{})
          assert p.get('verdict')=='VERIFIED_CLOSED', p
          assert b.get('failed')==0 and b.get('pending')==0, p
          assert b.get('published_readback_verified')==b.get('total')==2, p
          PY
