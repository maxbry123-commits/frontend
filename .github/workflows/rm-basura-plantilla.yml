name: rm basura plantilla
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf 'skills agente frontend' 'Download code frontend' 'Documentos proyectos frontend' Frontend 'Desplegar frontend' 'Refactoria frontend' 'PIPELINE frontend' 'Método de trabajo frontend' 'Agente motores frontend' 'UI YAIWES download' 'UI YAIWES web' 'MAXBRY web' 'Interface ui router' 'Interface ui osquestador auditor memoria' 'UI MAXBRY agi' 'Osquestador Maxbry' 'Interface de subscripción usuario' 'Módulos para  frontend'
          git add -A -- ':!.github'
          git diff --cached --quiet && exit 0
          git commit -m 'rm: plantillas vacias no pedidas'
          git pull --rebase origin main
          git push --no-verify origin main
