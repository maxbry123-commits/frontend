name: Factory F-UI-059 Router Panel
on:
  push:
    branches: [main]
    paths:
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/remote-control-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/f-ui-059-remote-control.test.mjs'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-ui-059-router-panel-web.spec.mjs'
      - '.github/workflows/factory-f-ui-059-router-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-f-ui-059-router-panel
  cancel-in-progress: true
jobs:
  router-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax and contract
        run: |
          node --check src/remote-control-v1.js
          node --check tests/f-ui-059-remote-control.test.mjs
          node tests/f-ui-059-remote-control.test.mjs
      - name: Browser router panel matrix
        run: npx playwright test tests/e2e/f-ui-059-router-panel-web.spec.mjs --project=chromium-desktop
      - name: Upload F-UI-059 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f-ui-059-router-panel-evidence-${{ github.sha }}
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results/f-ui-059/*.png
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report/**
          if-no-files-found: warn
          retention-days: 14
