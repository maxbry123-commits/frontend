name: YAIWES GAP-10 Steering OSS One Shot
run-name: GAP-10 steering OSS • ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-gap10-steering-oss-one-shot-20260914.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaiwes-gap10-steering-oss-one-shot
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Fetch exact canonical historical motor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, pathlib
          url = 'https://raw.githubusercontent.com/maxbry123-commits/frontend/cecfd0f79f38e5dcc5135ee13e42802879b5583e/%F0%9F%93%82componentes%20open%20soure%20fromtend/%F0%9F%93%82Motor%20descarga%20de%20componentes%20y%20extracci%C3%B3n%20de%20zip/hf_download_extract_engine.py'
          p = pathlib.Path('/tmp/hf_download_extract_engine.py')
          p.write_bytes(urllib.request.urlopen(url).read())
          if p.stat().st_size < 5000:
              raise SystemExit('MOTOR_FETCH_GAP')
          print('MOTOR_BYTES', p.stat().st_size)
          PY
      - name: Acquire extract publish readback selected steering systems
        shell: bash
        env:
          DEST_REPO: maxbry123-commits/frontend
          DEST_BRANCH: main
          DEST_ROOT: UI YAIWES/componentes open soure UI YAIWES/steering interprocess OSS
          PART_SIZE_MIB: '12'
          MAX_GITHUB_BLOB_MIB: '95'
          PUBLISH: '1'
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gap10-results
          run_one() {
            local repo="$1" ref="$2" slug="$3"
            echo "=== ${slug} ==="
            SOURCE_REPO="$repo" SOURCE_REF="$ref" SLUG="$slug" \
              python3 /tmp/hf_download_extract_engine.py | tee "/tmp/gap10-results/${slug}.jsonl"
            grep -q 'PUBLISHED_AND_EXTRACTED_READBACK_VERIFIED' "/tmp/gap10-results/${slug}.jsonl"
            grep -q 'VERIFIED_CLOSED' "/tmp/gap10-results/${slug}.jsonl"
          }
          run_one temporalio/sdk-python ab25ed693f7ec77589346e66c98db299a8c9c9fe Temporal-Python-SDK
          run_one dbos-inc/dbos-transact-py 83805fd84494c85ea09105443884a2786152d921 DBOS-Python
          run_one langchain-ai/langgraph e539ac122f4126f6dd850581c1494948cf620e31 LangGraph
          run_one hatchet-dev/hatchet 315d43a72fd771b049b304b865a81dbab98c466c Hatchet
      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/gap10-results -maxdepth 1 -type f -name '*.jsonl' -print -exec tail -n 1 {} \;
