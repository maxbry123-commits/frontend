name: YAIWES GAP10 Steering OSS Acquisition

on:
  push:
    paths:
      - '.github/workflows/yaiwes-gap10-steering-oss.yml'
      - 'UI YAIWES/_adquisicion/gap10-steering-oss-20260914/queue.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yaiwes-gap10-steering-oss
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute canonical Motor 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_FILE: UI YAIWES/_adquisicion/gap10-steering-oss-20260914/queue.json
          STATE_FILE: UI YAIWES/_adquisicion/gap10-steering-oss-20260914/motor2-state.json
          INDEX_PATH: UI YAIWES/_adquisicion/gap10-steering-oss-20260914/INDEX.md
          ENGINE_PATH: ➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip/hf_download_extract_engine.py
          MAX_RETRIES: '2'
          LOOP_SLEEP_SECONDS: '0'
        run: |
          python "➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip/motor_2_queue_download_extract.py"

      - name: Persist Motor 2 state and index
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "yaiwes-gap10-motor2"
          git config user.email "yaiwes-gap10-motor2@users.noreply.github.com"
          git add "UI YAIWES/_adquisicion/gap10-steering-oss-20260914/motor2-state.json" "UI YAIWES/_adquisicion/gap10-steering-oss-20260914/INDEX.md" || true
          if ! git diff --cached --quiet; then
            git commit -m "evidence(yaiwes): persist GAP-10 Motor 2 state"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
