name: GAP02 REQ-S3-044 Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gap02-req-s3-044-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_memory_authority_boundary.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/requirement_traces/REQ-S3-044.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/evidence/requirement_traces/REQ-S3-044.ci.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused REQ-S3-044 regression
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m unittest -v tests.test_memory_authority_boundary.MemoryAuthorityBoundaryTests.test_s3_044_memory_pack_exposes_no_runtime_authority_fields
      - name: REQ-S3-044 five-pass
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES'
          PYTHONPATH=runtime/src python - <<'PY'
          from pathlib import Path
          from audit.evidence import TrustedCIExecution, make_ci_verifier
          from audit.five_pass import audit_five_pass
          from coverage.trace_inventory import load_trace_inventory

          root = Path('.').resolve()
          trace = load_trace_inventory(root / 'runtime/requirement_traces', ('REQ-S3-044',))[0]

          def trusted_lookup(run_id: int, job_id: int) -> TrustedCIExecution:
              assert (run_id, job_id) == (34828607033, 103926374286)
              return TrustedCIExecution(
                  run_id=run_id,
                  job_id=job_id,
                  revision='ce19dc3c23539544e65d928e2c5c4b0d8a305190',
                  status='completed',
                  conclusion='success',
                  implementation_sha256='dc781e7afd5e19b39d53d111d51796c61dd2d4540c0241aba3f65920cbb07da2',
                  test_sha256='dc589418ea6fb642393503c234cd3ea76676d5f83879c8c2d3b5a5a713a7acd8',
              )

          result = audit_five_pass(
              root,
              ('REQ-S3-044',),
              (trace,),
              (trace.implementation.path,),
              make_ci_verifier(trusted_lookup),
          )
          print(result)
          assert result.status == 'TRACEABILITY_PASS'
          assert result.verified_requirements == 1
          assert result.total_requirements == 1
          PY
