name: factory-f-fe-190-oss-mermaid
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-f-fe-190-oss-mermaid.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/oss/mermaid-adapter-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/oss/f-fe-190-oss-mermaid.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-f-fe-190-oss-mermaid
  cancel-in-progress: false

jobs:
  mermaid-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Adapter readback
        run: |
          set -euo pipefail
          test -s src/oss/mermaid-adapter-v1.js
          test -s tests/e2e/oss/f-fe-190-oss-mermaid.spec.mjs
          grep -F "securityLevel: 'strict'" src/oss/mermaid-adapter-v1.js
          grep -F "sourceCommit: 'ba74a2c9a91b7108fe78daf66c3c7e1a897add5c'" src/oss/mermaid-adapter-v1.js
          node --check src/oss/mermaid-adapter-v1.js
          node --check tests/e2e/oss/f-fe-190-oss-mermaid.spec.mjs
          git hash-object src/oss/mermaid-adapter-v1.js
          git hash-object tests/e2e/oss/f-fe-190-oss-mermaid.spec.mjs
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop Mermaid adapter gate
        run: npx playwright test tests/e2e/oss/f-fe-190-oss-mermaid.spec.mjs --project=chromium-desktop --reporter=line
      - name: Mobile Mermaid adapter gate
        run: npx playwright test tests/e2e/oss/f-fe-190-oss-mermaid.spec.mjs --project=mobile-chromium --reporter=line
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-f-fe-190-oss-mermaid-evidence
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results
          if-no-files-found: warn
          retention-days: 14
