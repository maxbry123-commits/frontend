name: Motor Download Extract G2 Pending 9 20260910
run-name: Motor Download Extract G2 Pending 9 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/motor-download-extract-g2-pending-9-20260910.yml'

permissions:
  contents: write

concurrency:
  group: motor-download-extract-g2-pending-9-20260910
  cancel-in-progress: false

jobs:
  motor-group-2-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout canonical motor
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            ➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip
          sparse-checkout-cone-mode: false

      - name: Verify canonical motor blobs
        shell: bash
        run: |
          set -euo pipefail
          MOTOR_DIR='➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip'
          test "$(git hash-object "$MOTOR_DIR/motor_2_queue_download_extract.py")" = '84d566e2ee4e98e42eb3a864026d067d48caabd9'
          test "$(git hash-object "$MOTOR_DIR/hf_download_extract_engine.py")" = '91e6e4486692eab314be5c7130d8310d3c855397'

      - name: Execute canonical motor for Group 2 pending
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEST_REPO: maxbry123-commits/frontend
          DEST_BRANCH: main
          DEST_ROOT: UI YAIWES/Fabrica Empaque-local YAIWES/Download programas
          MAX_RETRIES: '3'
        run: |
          set -euo pipefail
          MOTOR_DIR="$GITHUB_WORKSPACE/➡️📂motores de descarga extracción copiado movimiento archivos fromtend/📂Motor descarga de componentes y extracción de zip"
          export ENGINE_PATH="$MOTOR_DIR/hf_download_extract_engine.py"
          export QUEUE_FILE="$RUNNER_TEMP/g2-pending.queue.json"
          export STATE_FILE="$RUNNER_TEMP/g2-pending.state.json"
          export INDEX_PATH="$RUNNER_TEMP/g2-pending.index.md"
          cat > "$QUEUE_FILE" <<'JSON'
          {"queue":[
            {"id":"g2p-001","source_repo":"tauri-apps/tauri","slug":"Tauri","publish":true},
            {"id":"g2p-002","source_repo":"nwjs/nw.js","slug":"NW.js","publish":true},
            {"id":"g2p-003","source_repo":"wailsapp/wails","slug":"Wails","publish":true},
            {"id":"g2p-004","source_repo":"nodegui/nodegui","slug":"NodeGui","publish":true},
            {"id":"g2p-005","source_repo":"r0x0r/pywebview","slug":"PyWebView","publish":true},
            {"id":"g2p-006","source_repo":"Squirrel/Squirrel.Windows","slug":"Squirrel","publish":true},
            {"id":"g2p-007","source_repo":"kichik/nsis","slug":"NSIS","publish":true},
            {"id":"g2p-008","source_repo":"openjdk/jdk","slug":"OpenJDK","publish":true},
            {"id":"g2p-009","source_repo":"appjs/appjs","slug":"AppJS","publish":true}
          ]}
          JSON
          python3 "$MOTOR_DIR/motor_2_queue_download_extract.py" | tee "$RUNNER_TEMP/g2-pending.result.jsonl"
          tail -n 1 "$RUNNER_TEMP/g2-pending.result.jsonl" > "$RUNNER_TEMP/g2-pending.final.json"
          python3 - "$RUNNER_TEMP/g2-pending.final.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          b=p.get('balance',{})
          assert p.get('verdict')=='VERIFIED_CLOSED', p
          assert b.get('failed')==0 and b.get('pending')==0, p
          assert b.get('published_readback_verified')==b.get('total')==9, p
          PY
