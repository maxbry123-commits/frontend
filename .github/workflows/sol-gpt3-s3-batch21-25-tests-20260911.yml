name: SOL GPT3 S3 Batch 21-25 Vendor Tests

on:
  push:
    paths:
      - '.github/workflows/sol-gpt3-s3-batch21-25-tests-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-gpt3-s3-batch21-25-tests-20260911
  cancel-in-progress: false

jobs:
  tanstack-query:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/TanStack Query/code
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/TanStack Query/code'
        run: pnpm install --frozen-lockfile
      - name: Run upstream CI tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/TanStack Query/code'
        run: pnpm test:ci

  react-virtuoso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.24.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code'
        env:
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Run upstream unit tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/React Virtuoso/code'
        run: pnpm test

  radix-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Radix UI
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.5.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Radix UI'
        run: pnpm install --frozen-lockfile
      - name: Run upstream unit tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Radix UI'
        run: pnpm exec vitest run

  shadcn-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/shadcn-ui/code
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/shadcn-ui/code'
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Run upstream shadcn package tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/shadcn-ui/code'
        run: pnpm shadcn:test

  tailwind-css:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS'
        run: pnpm install --frozen-lockfile
      - name: Run upstream Rust and Vitest suite
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Tailwind CSS'
        run: pnpm test
