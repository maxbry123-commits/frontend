name: SOL GPT3 S3 Batch 26-30 Vendor Tests

on:
  push:
    paths:
      - '.github/workflows/sol-gpt3-s3-batch26-30-tests-20260911.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-gpt3-s3-batch26-30-tests-20260911
  cancel-in-progress: false

jobs:
  react-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/react-markdown
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies from snapshot manifest
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/react-markdown'
        run: npm install
      - name: Run upstream build format and 100 percent coverage test
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/react-markdown'
        run: npm test

  shiki:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Shiki
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Shiki'
        env:
          SKIP_SIMPLE_GIT_HOOKS: '1'
        run: pnpm install --frozen-lockfile
      - name: Run upstream Vitest suite once
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Shiki'
        env:
          CI: 'true'
        run: pnpm exec vitest run

  codemirror-6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/CodeMirror 6
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/CodeMirror 6'
        run: npm install
      - name: Run upstream Node test suite
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/CodeMirror 6'
        run: npm run test-node

  sandpack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/Sandpack
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Activate Yarn v1
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Sandpack'
        run: yarn install --frozen-lockfile
      - name: Run upstream workspace tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/Sandpack'
        run: yarn test

  xterm-js:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/componentes open soure UI YAIWES/xterm.js
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/xterm.js'
        run: npm ci
      - name: Build TypeScript workspace
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/xterm.js'
        run: npm run build
      - name: Run upstream unit tests
        working-directory: 'UI YAIWES/componentes open soure UI YAIWES/xterm.js'
        run: npm run test-unit
