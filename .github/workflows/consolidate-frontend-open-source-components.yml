name: Consolidate frontend open-source components

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/consolidate-frontend-open-source-components.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: consolidate-frontend-open-source-components
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout metadata
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github/workflows
          sparse-checkout-cone-mode: false

      - name: Audit, move and verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib, subprocess, urllib.request

          DEST = "📂componentes open soure fromtend"
          repo = os.environ["REPOSITORY"]
          current_run = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          def run(args, env=None, data=None, check=True):
              return subprocess.run(
                  args, env=env, input=data, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, check=check
              )

          def text(args, env=None):
              return subprocess.check_output(args, env=env, text=True).strip()

          base = text(["git", "rev-parse", "HEAD"])
          if base != text(["git", "rev-parse", "origin/main"]):
              raise SystemExit("FAIL_CLOSED: HEAD differs from origin/main")

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "frontend-components-audit",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              actions = json.load(response)

          open_states = {"queued", "in_progress", "waiting", "requested", "pending"}
          other_open = [
              x for x in actions.get("workflow_runs", [])
              if x.get("status") in open_states and x.get("id") != current_run
          ]
          print("OTHER_OPEN_ACTION_RUNS", len(other_open))
          for x in other_open:
              print("OPEN_RUN", x.get("status"), x.get("name"), x.get("html_url"))

          idx = pathlib.Path(os.environ["RUNNER_TEMP"]) / "frontend-components.index"
          idx.unlink(missing_ok=True)
          env = os.environ.copy()
          env["GIT_INDEX_FILE"] = str(idx)
          run(["git", "read-tree", base], env=env)

          def ls(treeish, prefix):
              raw = subprocess.check_output(["git", "ls-tree", "-rz", treeish, "--", prefix])
              result = []
              for record in raw.split(b"\0"):
                  if not record:
                      continue
                  meta, path = record.split(b"\t", 1)
                  mode, typ, sha = meta.decode("ascii").split(" ")
                  result.append((mode, sha, path.decode("utf-8")))
              return result

          zero = "0" * 40
          specs = [
              ("Fromtend code", DEST + "/Fromtend code"),
              ("UI YAIWES", DEST + "/UI YAIWES"),
              ("Trabajo de grock/fromted/sources", DEST + "/fromted-sources"),
          ]
          payload = bytearray()
          planned = []

          for old, new in specs:
              src = ls(base, old)
              dst = ls(base, new)
              if src and dst:
                  raise SystemExit("FAIL_CLOSED collision: " + old + " and " + new)
              if not src:
                  if dst:
                      print("ALREADY_MOVED", old, "->", new)
                  else:
                      print("SOURCE_NOT_PRESENT", old)
                  continue
              mapping = []
              for mode, sha, path in src:
                  rel = path[len(old):].lstrip("/")
                  new_path = new + "/" + rel
                  mapping.append((mode, sha, path, new_path))
                  payload.extend((mode + " " + sha + "\t" + new_path).encode() + b"\0")
                  payload.extend(("0 " + zero + "\t" + path).encode() + b"\0")
              planned.append((old, new, mapping))
              print("PLAN_MOVE", old, "->", new, "entries", len(mapping))

          if payload:
              run(["git", "update-index", "-z", "--index-info"], env=env, data=bytes(payload))

          # Component blobs only: do not modify .github/workflows from inside this run.\n          # This avoids requiring GitHub App workflow-write permission.\n\n          tree = text(["git", "write-tree"], env=env)
          total = 0

          for old, new, mapping in planned:
              if ls(tree, old):
                  raise SystemExit("VERIFY_FAIL source remains: " + old)
              actual = {p: (m, s) for m, s, p in ls(tree, new)}
              expected = {np: (m, s) for m, s, op, np in mapping}
              if actual != expected:
                  raise SystemExit("VERIFY_FAIL destination mismatch: " + new)
              total += len(mapping)
              print("VERIFY_PASS", old, "->", new, "entries", len(mapping))

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(
              ["git", "config", "user.email",
               "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True
          )
          commit_env = os.environ.copy()
          commit_env["GIT_AUTHOR_NAME"] = "github-actions[bot]"
          commit_env["GIT_AUTHOR_EMAIL"] = "41898282+github-actions[bot]@users.noreply.github.com"
          commit_env["GIT_COMMITTER_NAME"] = "github-actions[bot]"
          commit_env["GIT_COMMITTER_EMAIL"] = "41898282+github-actions[bot]@users.noreply.github.com"

          message = (
              "chore(frontend): consolidate open-source components "
              + "[entries=" + str(total) + " open-runs=" + str(len(other_open)) + "]"
          )
          commit = run(
              ["git", "commit-tree", tree, "-p", base],
              env=commit_env,
              data=(message + "\n").encode()
          ).stdout.decode().strip()

          run(["git", "fetch", "origin", "main"])
          if text(["git", "rev-parse", "origin/main"]) != base:
              raise SystemExit("FAIL_CLOSED: main changed during migration")

          pushed = run(
              ["git", "push", "origin", commit + ":refs/heads/main"],
              check=False
          )
          if pushed.returncode:
              raise SystemExit(
                  "PUSH_FAIL " + pushed.stdout.decode(errors="replace")
                  + pushed.stderr.decode(errors="replace")
              )

          print("MIGRATION_COMMIT", commit)
          print("TOTAL_MOVED_ENTRIES", total)
          print("OTHER_OPEN_ACTION_RUNS", len(other_open))
          PY
