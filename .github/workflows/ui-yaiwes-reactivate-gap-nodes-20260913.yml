name: UI YAIWES Reactivate GAP Nodes

on:
  push:
    paths:
      - '.github/workflows/ui-yaiwes-reactivate-gap-nodes-20260913.yml'

permissions:
  contents: write

jobs:
  reactivate:
    runs-on: ubuntu-latest
    steps:
      - name: Reactivate only reported GAP nodes through Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request

          owner = 'maxbry123-commits'
          repo = 'frontend'
          branch = 'main'
          path = 'UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json'
          targets = {
              'N03-AUTO-AUDITOR-EVIDENCE',
              'N14-RESEARCH-SOURCE-VERIFICATION',
              'N16-CHECKPOINT-BYTES-HASH',
              'N18-MEMORY-RETRIEVAL-CONTEXT',
              'N22-OTEL-RUNTIME',
              'N24-CONSOLIDATOR',
              'N26-GLOBAL-INTEGRATION',
              'N28-API-CONTROL',
          }
          token = os.environ['GH_TOKEN']
          qpath = urllib.parse.quote(path, safe='/')
          url = f'https://api.github.com/repos/{owner}/{repo}/contents/{qpath}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'yaiwes-gap-reactivator',
          }

          def request(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          for attempt in range(1, 6):
              current = request('GET')
              text = base64.b64decode(current['content']).decode('utf-8')
              changed = []
              out = []
              for line in text.splitlines(True):
                  hit = next((node_id for node_id in targets if f'"id":"{node_id}"' in line), None)
                  if hit and '"state":"GAP"' in line:
                      line = line.replace('"state":"GAP"', '"state":"GAP_RESOLVABLE"', 1)
                      changed.append(hit)
                  out.append(line)
              if not changed:
                  print('NO_GAP_NODES_LEFT_TO_REACTIVATE')
                  raise SystemExit(0)
              payload = {
                  'message': 'coordination(crazy-wall): GAP -> GAP_RESOLVABLE',
                  'content': base64.b64encode(''.join(out).encode('utf-8')).decode('ascii'),
                  'sha': current['sha'],
                  'branch': branch,
              }
              try:
                  result = request('PUT', payload)
                  print('REACTIVATED=' + ','.join(sorted(changed)))
                  print('COMMIT=' + result['commit']['sha'])
                  raise SystemExit(0)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (409, 422) or attempt == 5:
                      raise
                  time.sleep(1)
          PY
