name: UI YAIWES Reactivate GAP Nodes

on:
  push:
    paths:
      - '.github/workflows/ui-yaiwes-reactivate-gap-nodes-20260913.yml'

permissions:
  contents: write

jobs:
  reactivate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reactivate only reported GAP nodes
        shell: bash
        run: |
          set -euo pipefail
          TARGET='UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from pathlib import Path
          p = Path('UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json')
          targets = {
              'N03-AUTO-AUDITOR-EVIDENCE',
              'N14-RESEARCH-SOURCE-VERIFICATION',
              'N16-CHECKPOINT-BYTES-HASH',
              'N18-MEMORY-RETRIEVAL-CONTEXT',
              'N22-OTEL-RUNTIME',
              'N24-CONSOLIDATOR',
              'N26-GLOBAL-INTEGRATION',
              'N28-API-CONTROL',
          }
          lines = p.read_text(encoding='utf-8').splitlines(True)
          changed = []
          out = []
          for line in lines:
              hit = next((node_id for node_id in targets if f'"id":"{node_id}"' in line), None)
              if hit and '"state":"GAP"' in line:
                  line = line.replace('"state":"GAP"', '"state":"GAP_RESOLVABLE"', 1)
                  changed.append(hit)
              out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          print('REACTIVATED=' + ','.join(sorted(changed)))
          PY
            if git diff --quiet -- "$TARGET"; then
              echo 'No GAP nodes remain to reactivate.'
              exit 0
            fi
            git config user.name 'yaiwes-supervisor'
            git config user.email 'yaiwes-supervisor@users.noreply.github.com'
            git add -- "$TARGET"
            git commit -m 'coordination(crazy-wall): GAP -> GAP_RESOLVABLE'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push collision attempt=$attempt; retrying from fresh main"
          done
          exit 1
