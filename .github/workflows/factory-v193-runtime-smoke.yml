name: Factory V1.9.3 Canonical Runtime Smoke
on:
  push:
    branches: [main]
    paths:
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/index-v193.html'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/bootstrap/candidate-v193.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/canonical-v193-runtime.spec.mjs'
      - '.github/workflows/factory-v193-runtime-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-v193-runtime-smoke
  cancel-in-progress: true
jobs:
  canonical-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s index-v193.html
          test -s src/bootstrap/candidate-v193.js
          test -s tests/e2e/canonical-v193-runtime.spec.mjs
          grep -F './src/bootstrap/candidate-v193.js' index-v193.html
          node --check src/bootstrap/candidate-v193.js
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop canonical smoke
        run: npx playwright test tests/e2e/canonical-v193-runtime.spec.mjs --project=chromium-desktop
      - name: Mobile canonical smoke
        run: npx playwright test tests/e2e/canonical-v193-runtime.spec.mjs --project=mobile-chromium
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-v193-runtime-${{ github.sha }}
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report/**
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results/**
          if-no-files-found: warn
          retention-days: 14
