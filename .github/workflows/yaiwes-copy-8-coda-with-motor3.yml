name: YAIWES Copy 8 CODA with Motor3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yaiwes-copy-8-coda-with-motor3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frontend destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agentes source and authorized copy motor
        uses: actions/checkout@v4
        with:
          repository: maxbry123-commits/agentes
          ref: main
          path: _agentes_source
          fetch-depth: 1

      - name: Execute Motor3 for selected CODA components
        shell: bash
        run: |
          set -euo pipefail
          MOTOR="$GITHUB_WORKSPACE/_agentes_source/Motores/➡️📂motor de copiar archivos/motor_3_copy_batches.py"
          BASE_SRC="$GITHUB_WORKSPACE/_agentes_source/📂coda workflow persistencias"
          BASE_DST="$GITHUB_WORKSPACE/UI YAIWES/24-CODA-INTEGRATION/components"
          STATE="$GITHUB_WORKSPACE/UI YAIWES/24-CODA-INTEGRATION/copy-evidence"
          mkdir -p "$BASE_DST" "$STATE"

          for n in 08 11 12 15 16 21 22 23; do
            src=$(find "$BASE_SRC" -maxdepth 1 -type d -name "*YAIWES $n" -print -quit)
            test -n "$src" || { echo "SOURCE_NOT_FOUND YAIWES $n"; exit 1; }
            dst="$BASE_DST/YAIWES-$n"
            SOURCE_DIR="$src" \
            DEST_DIR="$dst" \
            STATE_FILE="$STATE/YAIWES-$n.motor3-state.json" \
            BATCH_SIZE=100 \
            COLLISION_POLICY=replace \
            MAX_BATCHES=0 \
            python "$MOTOR" | tee "$STATE/YAIWES-$n.result.json"
          done

      - name: Validate Motor3 verdicts and source/destination hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path.cwd()
          srcbase = root/'_agentes_source'/'📂coda workflow persistencias'
          dstbase = root/'UI YAIWES'/'24-CODA-INTEGRATION'/'components'
          evbase = root/'UI YAIWES'/'24-CODA-INTEGRATION'/'copy-evidence'
          nums = ['08','11','12','15','16','21','22','23']
          summary=[]
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
              return h.hexdigest()
          for n in nums:
              result=json.loads((evbase/f'YAIWES-{n}.result.json').read_text())
              if result['verdict'] != 'VERIFIED_CLOSED': raise SystemExit(f'MOTOR3_NOT_CLOSED:{n}:{result}')
              src=next(p for p in srcbase.iterdir() if p.is_dir() and p.name.endswith(f'YAIWES {n}'))
              dst=dstbase/f'YAIWES-{n}'
              sfiles={p.relative_to(src).as_posix():sha(p) for p in src.rglob('*') if p.is_file()}
              dfiles={p.relative_to(dst).as_posix():sha(p) for p in dst.rglob('*') if p.is_file()}
              if sfiles != dfiles: raise SystemExit(f'HASH_TREE_MISMATCH:{n}')
              summary.append({'component':n,'files':len(sfiles),'tree_hashes_match':True,'motor_verdict':'VERIFIED_CLOSED'})
          (evbase/'COPY-VALIDATION-SUMMARY.json').write_text(json.dumps({'schema':'yaiwes.coda.copy-validation/v1','components':summary,'all_8_verified':True},indent=2)+'\n')
          PY

      - name: Remove nested source checkout before commit
        run: rm -rf _agentes_source

      - name: Commit copied components and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'UI YAIWES/24-CODA-INTEGRATION/components' 'UI YAIWES/24-CODA-INTEGRATION/copy-evidence'
          git diff --cached --quiet && { echo 'No changes; copies already verified.'; exit 0; }
          git commit -m 'feat(ui-yaiwes): copy and verify CODA 08 11 12 15 16 21 22 23 with Motor3'
          git push origin HEAD:main
