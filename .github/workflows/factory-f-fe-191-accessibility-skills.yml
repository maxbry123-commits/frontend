name: factory-f-fe-191-accessibility-skills
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-f-fe-191-accessibility-skills.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/oss/accessibility-skills-qa-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/oss/f-fe-191-accessibility-skills.spec.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-f-fe-191-accessibility-skills
  cancel-in-progress: false
jobs:
  accessibility-skills-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: QA adapter readback
        run: |
          set -euo pipefail
          test -s src/oss/accessibility-skills-qa-v1.js
          test -s tests/e2e/oss/f-fe-191-accessibility-skills.spec.mjs
          grep -F "0bb892f739f64b7a0183bafeba533b0b7007abd4" src/oss/accessibility-skills-qa-v1.js
          grep -F "VIEWPORT_ZOOM_BLOCKED" src/oss/accessibility-skills-qa-v1.js
          grep -F "POSITIVE_TABINDEX" src/oss/accessibility-skills-qa-v1.js
          node --check src/oss/accessibility-skills-qa-v1.js
          node --check tests/e2e/oss/f-fe-191-accessibility-skills.spec.mjs
          git hash-object src/oss/accessibility-skills-qa-v1.js
          git hash-object tests/e2e/oss/f-fe-191-accessibility-skills.spec.mjs
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop accessibility-skills QA gate
        run: npx playwright test tests/e2e/oss/f-fe-191-accessibility-skills.spec.mjs --project=chromium-desktop --reporter=line
      - name: Mobile accessibility-skills QA gate
        run: npx playwright test tests/e2e/oss/f-fe-191-accessibility-skills.spec.mjs --project=mobile-chromium --reporter=line
