name: factory-F-FE-110-ELEMENT-WINDOW
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-F-FE-110-ELEMENT-WINDOW.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/control-audit/F-FE-110-ELEMENT-WINDOW.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-F-FE-110-ELEMENT-WINDOW
  cancel-in-progress: false

jobs:
  element-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frozen candidate and browser readback
        run: |
          set -euo pipefail
          test -s index-v192.html
          test -s src/app-v19.js
          test -s src/ui/component-browser-v1.js
          test -s tests/e2e/control-audit/F-FE-110-ELEMENT-WINDOW.spec.mjs
          grep -F "['window','Ventana','Contenedor']" src/app-v19.js
          grep -F "allowCanonicalInsert" src/ui/component-browser-v1.js
          node --check tests/e2e/control-audit/F-FE-110-ELEMENT-WINDOW.spec.mjs
          echo "INDEX_V192=$(git hash-object index-v192.html)"
          echo "APP_V19=$(git hash-object src/app-v19.js)"
          echo "BROWSER_V1=$(git hash-object src/ui/component-browser-v1.js)"
          test "$(git hash-object index-v192.html)" = "e3d68e1063cd37c2a59d91911f071fda304e4695"
          test "$(git hash-object src/app-v19.js)" = "1aab6ebec09a8e6a14f221b83226cf92552b4526"
          test "$(git hash-object src/ui/component-browser-v1.js)" = "6803afedfd2f6bd08b528d71d6c175747a31bb43"
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: F-FE-110 desktop ELEMENT-WINDOW gate
        run: npx playwright test tests/e2e/control-audit/F-FE-110-ELEMENT-WINDOW.spec.mjs --project=chromium-desktop --reporter=line
      - name: F-FE-110 Pixel 7 ELEMENT-WINDOW gate
        run: npx playwright test tests/e2e/control-audit/F-FE-110-ELEMENT-WINDOW.spec.mjs --project=mobile-chromium --reporter=line
      - name: Preserve F-FE-110 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-F-FE-110-ELEMENT-WINDOW-evidence
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results
          if-no-files-found: warn
          retention-days: 14
