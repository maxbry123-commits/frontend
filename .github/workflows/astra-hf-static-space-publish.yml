name: Astra Publish YAIWES Factory to Hugging Face Static Space

on:
  push:
    paths:
      - '.github/workflows/astra-hf-static-space-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: astra-hf-static-space-publish
  cancel-in-progress: true

jobs:
  publish-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN_A: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_B: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_TOKEN_C: ${{ secrets.HUGGING_FACE_TOKEN }}
      HF_TOKEN_D: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
      HF_TOKEN_E: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      SPACE_REPO: COMAND-CENTER-1/yaiwes-ui-factory
      HF_OIDC_RESOURCE: spaces/COMAND-CENTER-1/yaiwes-ui-factory
      SOURCE_REF: 8d5a7ed86f9af517b0d42f5aad9e2f7359edd7f0
      RAW_ROOT: https://raw.githubusercontent.com/maxbry123-commits/frontend/8d5a7ed86f9af517b0d42f5aad9e2f7359edd7f0/UI%20YAIWES/watchdog%20UI%20YAIWES/%E2%9E%A1%EF%B8%8F%20Astra%20plan%20f%C3%A1brica%20UI%20YAIWES/Frontend/factory-v0
    steps:
      - name: Package exact verified Factory V0 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _hf_space_publish
          mkdir -p _hf_space_publish/src/donors
          curl -fsSL "$RAW_ROOT/index.html" -o _hf_space_publish/index.html
          curl -fsSL "$RAW_ROOT/styles.css" -o _hf_space_publish/styles.css
          for f in app.js actions.js state.js backend-adapter.js; do
            curl -fsSL "$RAW_ROOT/src/$f" -o "_hf_space_publish/src/$f"
          done
          curl -fsSL "$RAW_ROOT/src/donors/lucide-icons.js" -o _hf_space_publish/src/donors/lucide-icons.js
          cat > _hf_space_publish/README.md <<'EOF'
          ---
          title: YAIWES UI Factory
          emoji: 🏭
          colorFrom: indigo
          colorTo: purple
          sdk: static
          app_file: index.html
          pinned: false
          ---

          # YAIWES UI Factory
          Visual Static Space for the YAIWES UI Factory.
          Verified source SHA: `8d5a7ed86f9af517b0d42f5aad9e2f7359edd7f0`.
          EOF
          echo "SOURCE_REF=$SOURCE_REF"
          echo "PACKAGE_FILES=$(find _hf_space_publish -type f | wc -l)"
          grep -q 'YAIWES UI Factory' _hf_space_publish/index.html
          grep -q 'LUCIDE_PROVENANCE' _hf_space_publish/src/donors/lucide-icons.js
          grep -q 'a53bd66a03dfd5609c3638379869e83dc207b051' _hf_space_publish/src/donors/lucide-icons.js
          sha256sum _hf_space_publish/index.html _hf_space_publish/styles.css _hf_space_publish/src/*.js _hf_space_publish/src/donors/*.js
          echo 'PACKAGE_VERIFY=PASS'

      - name: Install current Hugging Face CLI with OIDC support
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19.0,<2'
          hf --version
          echo 'HF_CLI_READY=YES'

      - name: Resolve Hugging Face authentication without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for candidate in "$HF_TOKEN_A" "$HF_TOKEN_B" "$HF_TOKEN_C" "$HF_TOKEN_D" "$HF_TOKEN_E"; do
            if [ -n "$candidate" ]; then token="$candidate"; break; fi
          done
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            printf 'HF_PUBLISH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo 'HF_AUTH_MODE=secret' >> "$GITHUB_ENV"
            echo 'HF_AUTH_SELECTED=SECRET'
          else
            echo 'HF_AUTH_MODE=oidc' >> "$GITHUB_ENV"
            echo 'HF_AUTH_SELECTED=OIDC'
          fi

      - name: Publish public Static Space
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HF_AUTH_MODE" = 'secret' ]; then
            python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo
          token = os.environ['HF_PUBLISH_TOKEN']
          repo_id = os.environ['SPACE_REPO']
          api = HfApi(token=token)
          me = api.whoami()
          print('HF_AUTH_ACCOUNT=' + str(me.get('name') or me.get('fullname') or 'UNKNOWN'))
          url = create_repo(repo_id=repo_id, repo_type='space', space_sdk='static', private=False, exist_ok=True, token=token)
          print('HF_SPACE_REPO_URL=' + str(url))
          commit = api.upload_folder(repo_id=repo_id, repo_type='space', folder_path='_hf_space_publish', commit_message='Publish YAIWES UI Factory verified static preview')
          print('HF_SPACE_UPLOAD_COMMIT=' + str(commit))
          PY
          else
            echo "HF_OIDC_RESOURCE=$HF_OIDC_RESOURCE"
            hf upload "$SPACE_REPO" _hf_space_publish . --repo-type space --commit-message "Publish YAIWES UI Factory via GitHub OIDC ${GITHUB_SHA::7}"
          fi
          echo 'HF_SPACE_UPLOAD=PASS'

      - name: Verify persistent Space page and discovered static app host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request
          api='https://huggingface.co/api/spaces/COMAND-CENTER-1/yaiwes-ui-factory'
          page='https://huggingface.co/spaces/COMAND-CENTER-1/yaiwes-ui-factory'
          def read(url):
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status, r.read().decode('utf-8','ignore')
          status, meta_body = read(api)
          meta=json.loads(meta_body)
          app=meta.get('host')
          print(f'HF_SPACE_META status={status} sdk={meta.get("sdk")} private={meta.get("private")} stage={meta.get("runtime",{}).get("stage")} host={app} sha={meta.get("sha")}')
          if status != 200 or meta.get('sdk') != 'static' or not app:
              raise SystemExit('HF_SPACE_METADATA_INVALID')
          for url, marker in [(page, 'YAIWES'), (app.rstrip('/')+'/', 'YAIWES UI Factory')]:
              last=None
              for attempt in range(36):
                  try:
                      s, body=read(url)
                      print(f'HTTP_CHECK url={url} status={s} bytes={len(body)} attempt={attempt+1}')
                      if s == 200 and marker in body:
                          print(f'HTTP_READBACK_PASS={url}')
                          break
                  except Exception as e:
                      last=repr(e)
                  time.sleep(5)
              else:
                  raise SystemExit(f'PERSISTENT_URL_VERIFY_FAILED url={url} last={last}')
          print('HF_STATIC_SPACE_PUBLISH=PASS')
          PY
