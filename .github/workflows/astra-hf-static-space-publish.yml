name: Astra Publish YAIWES Factory to Hugging Face Static Space

on:
  push:
    paths:
      - '.github/workflows/astra-hf-static-space-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: astra-hf-static-space-publish
  cancel-in-progress: true

jobs:
  publish-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN_A: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_B: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_TOKEN_C: ${{ secrets.HUGGING_FACE_TOKEN }}
      HF_TOKEN_D: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
      HF_TOKEN_E: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      SPACE_REPO: COMAND-CENTER-1/yaiwes-ui-factory
      HF_OIDC_RESOURCE: spaces/COMAND-CENTER-1/yaiwes-ui-factory
      SOURCE_REF: bcf4a2037a3092d6cf1343ecd0185c0c6edfa758
      RAW_ROOT: https://raw.githubusercontent.com/maxbry123-commits/frontend/bcf4a2037a3092d6cf1343ecd0185c0c6edfa758/UI%20YAIWES/watchdog%20UI%20YAIWES/%E2%9E%A1%EF%B8%8F%20Astra%20plan%20f%C3%A1brica%20UI%20YAIWES/Frontend/factory-v0
    steps:
      - name: Package exact verified Factory V1.7 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _hf_space_publish
          mkdir -p _hf_space_publish/src/donors
          for f in index.html styles.css interaction-fix.css frappe-context-menu.css resize-snap.css xyflow-minimap.css; do
            curl -fsSL "$RAW_ROOT/$f" -o "_hf_space_publish/$f"
          done
          for f in app.js actions.js state.js backend-adapter.js interaction-fix.js scroll-preserver.js resize-snap.js; do
            curl -fsSL "$RAW_ROOT/src/$f" -o "_hf_space_publish/src/$f"
          done
          for f in lucide-icons.js oss-registry.js frappe-builder-patterns.js frappe-context-menu-adapter.js craftjs-patterns.js xyflow-patterns.js xyflow-minimap-adapter.js; do
            curl -fsSL "$RAW_ROOT/src/donors/$f" -o "_hf_space_publish/src/donors/$f"
          done
          cat > _hf_space_publish/README.md <<'EOF'
          ---
          title: YAIWES UI Factory
          emoji: 🏭
          colorFrom: indigo
          colorTo: purple
          sdk: static
          app_file: index.html
          pinned: false
          ---

          # YAIWES UI Factory V1.7
          Zero-friction editor with persistent canvas, draggable library, layers, responsive breakpoints, zoom, Frappe-derived context actions, Craft-derived resize semantics with 8 px snap, xyflow-derived viewport minimap/navigation, and audited 66-family OSS capability catalog.
          Verified source SHA: `bcf4a2037a3092d6cf1343ecd0185c0c6edfa758`.
          EOF

          node --check _hf_space_publish/src/app.js
          node --check _hf_space_publish/src/actions.js
          node --check _hf_space_publish/src/state.js
          node --check _hf_space_publish/src/backend-adapter.js
          node --check _hf_space_publish/src/interaction-fix.js
          node --check _hf_space_publish/src/scroll-preserver.js
          node --check _hf_space_publish/src/resize-snap.js
          for f in _hf_space_publish/src/donors/*.js; do node --check "$f"; done

          grep -q 'frappe-context-menu.css' _hf_space_publish/index.html
          grep -q 'resize-snap.css' _hf_space_publish/index.html
          grep -q 'xyflow-minimap.css' _hf_space_publish/index.html
          grep -q 'frappe-context-menu-adapter.js' _hf_space_publish/index.html
          grep -q 'resize-snap.js' _hf_space_publish/index.html
          grep -q 'scroll-preserver.js' _hf_space_publish/index.html
          grep -q 'xyflow-minimap-adapter.js' _hf_space_publish/index.html
          grep -q 'DONOR_ACTIVE' _hf_space_publish/src/donors/oss-registry.js
          grep -q 'Craft.js' _hf_space_publish/src/donors/oss-registry.js
          grep -q 'Frappe Builder' _hf_space_publish/src/donors/oss-registry.js
          grep -q 'xyflow' _hf_space_publish/src/donors/oss-registry.js
          grep -q 'sourceBlob' _hf_space_publish/src/donors/frappe-context-menu-adapter.js
          grep -q 'sourceBlob' _hf_space_publish/src/resize-snap.js
          grep -q 'sourceBlob' _hf_space_publish/src/donors/xyflow-minimap-adapter.js
          sha256sum _hf_space_publish/index.html _hf_space_publish/*.css _hf_space_publish/src/*.js _hf_space_publish/src/donors/*.js
          echo 'PACKAGE_VERIFY=PASS'

      - name: Install current Hugging Face CLI with OIDC support
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19.0,<2'
          hf --version

      - name: Resolve Hugging Face authentication without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for candidate in "$HF_TOKEN_A" "$HF_TOKEN_B" "$HF_TOKEN_C" "$HF_TOKEN_D" "$HF_TOKEN_E"; do
            if [ -n "$candidate" ]; then token="$candidate"; break; fi
          done
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            printf 'HF_PUBLISH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo 'HF_AUTH_MODE=secret' >> "$GITHUB_ENV"
            echo 'HF_AUTH_SELECTED=SECRET'
          else
            echo 'HF_AUTH_MODE=oidc' >> "$GITHUB_ENV"
            echo 'HF_AUTH_SELECTED=OIDC'
          fi

      - name: Publish public Static Space
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HF_AUTH_MODE" = 'secret' ]; then
            python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo
          token=os.environ['HF_PUBLISH_TOKEN']; repo_id=os.environ['SPACE_REPO']; api=HfApi(token=token)
          create_repo(repo_id=repo_id,repo_type='space',space_sdk='static',private=False,exist_ok=True,token=token)
          print(api.upload_folder(repo_id=repo_id,repo_type='space',folder_path='_hf_space_publish',commit_message='Publish YAIWES UI Factory V1.7'))
          PY
          else
            hf upload "$SPACE_REPO" _hf_space_publish . --repo-type space --commit-message "Publish YAIWES UI Factory V1.7 via GitHub OIDC ${GITHUB_SHA::7}"
          fi
          echo 'HF_SPACE_UPLOAD=PASS'

      - name: Verify persistent Space page and app host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.request
          api='https://huggingface.co/api/spaces/COMAND-CENTER-1/yaiwes-ui-factory'
          def read(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:return r.status,r.read().decode('utf-8','ignore')
          s,b=read(api); meta=json.loads(b); app=meta.get('host')
          print('HF_META',s,meta.get('sdk'),meta.get('runtime',{}).get('stage'),app,meta.get('sha'))
          if s!=200 or meta.get('sdk')!='static' or not app: raise SystemExit('HF_SPACE_METADATA_INVALID')
          for attempt in range(36):
              try:
                  s,body=read(app.rstrip('/')+'/')
                  if s==200 and all(x in body for x in ['YAIWES UI Factory','V1.7','Canvas listo','Elementos','Capas','HERRAMIENTAS DEL PASO','Desktop','Tablet','Móvil','resize-snap.js','frappe-context-menu-adapter.js','xyflow-minimap-adapter.js']):
                      print('HTTP_READBACK_PASS='+app);break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit('PERSISTENT_URL_VERIFY_FAILED')
          print('HF_STATIC_SPACE_PUBLISH=PASS')
          PY
