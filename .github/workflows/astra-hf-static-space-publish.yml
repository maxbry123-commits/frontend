name: Astra Publish YAIWES Factory to Hugging Face Static Space

on:
  push:
    paths:
      - '.github/workflows/astra-hf-static-space-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: astra-hf-static-space-publish
  cancel-in-progress: true

jobs:
  publish-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN_A: ${{ secrets.HF_TOKEN }}
      HF_TOKEN_B: ${{ secrets.HUGGINGFACE_TOKEN }}
      HF_TOKEN_C: ${{ secrets.HUGGING_FACE_TOKEN }}
      HF_TOKEN_D: ${{ secrets.HUGGINGFACEHUB_API_TOKEN }}
      HF_TOKEN_E: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
      SPACE_REPO: COMAND-CENTER-1/yaiwes-ui-factory
      HF_OIDC_RESOURCE: spaces/COMAND-CENTER-1/yaiwes-ui-factory
      SOURCE_REF: 14b84ea521d1fa111a41fce0d5b3f8cb61b0c652
      RAW_ROOT: https://raw.githubusercontent.com/maxbry123-commits/frontend/14b84ea521d1fa111a41fce0d5b3f8cb61b0c652/UI%20YAIWES/watchdog%20UI%20YAIWES/%E2%9E%A1%EF%B8%8F%20Astra%20plan%20f%C3%A1brica%20UI%20YAIWES/Frontend/factory-v0
    steps:
      - name: Package exact verified Factory V1.2 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _hf_space_publish
          mkdir -p _hf_space_publish/src/donors
          curl -fsSL "$RAW_ROOT/index.html" -o _hf_space_publish/index.html
          curl -fsSL "$RAW_ROOT/styles.css" -o _hf_space_publish/styles.css
          for f in app.js actions.js state.js backend-adapter.js; do
            curl -fsSL "$RAW_ROOT/src/$f" -o "_hf_space_publish/src/$f"
          done
          curl -fsSL "$RAW_ROOT/src/donors/lucide-icons.js" -o _hf_space_publish/src/donors/lucide-icons.js
          cat > _hf_space_publish/README.md <<'EOF'
          ---
          title: YAIWES UI Factory
          emoji: 🏭
          colorFrom: indigo
          colorTo: purple
          sdk: static
          app_file: index.html
          pinned: false
          ---

          # YAIWES UI Factory V1.2
          Zero-friction UI factory with persistent canvas, draggable element library and one contextual tool panel per step.
          Verified source SHA: `14b84ea521d1fa111a41fce0d5b3f8cb61b0c652`.
          EOF
          grep -q 'canvas-pane' _hf_space_publish/index.html
          grep -q 'context-pane' _hf_space_publish/index.html
          grep -q 'component-library' _hf_space_publish/index.html
          grep -q 'MOVE_COMPONENT' _hf_space_publish/src/actions.js
          grep -q 'ondrop' _hf_space_publish/src/app.js
          grep -q 'step4' _hf_space_publish/src/app.js
          grep -q 'BLOCKED_NO_MODEL' _hf_space_publish/src/app.js
          grep -q 'LUCIDE_PROVENANCE' _hf_space_publish/src/donors/lucide-icons.js
          sha256sum _hf_space_publish/index.html _hf_space_publish/styles.css _hf_space_publish/src/*.js _hf_space_publish/src/donors/*.js
          echo 'PACKAGE_VERIFY=PASS'

      - name: Install current Hugging Face CLI with OIDC support
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check 'huggingface_hub>=1.19.0,<2'
          hf --version

      - name: Resolve Hugging Face authentication without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for candidate in "$HF_TOKEN_A" "$HF_TOKEN_B" "$HF_TOKEN_C" "$HF_TOKEN_D" "$HF_TOKEN_E"; do
            if [ -n "$candidate" ]; then token="$candidate"; break; fi
          done
          if [ -n "$token" ]; then
            echo "::add-mask::$token"
            printf 'HF_PUBLISH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
            echo 'HF_AUTH_MODE=secret' >> "$GITHUB_ENV"
            echo 'HF_AUTH_SELECTED=SECRET'
          else
            echo 'HF_AUTH_MODE=oidc' >> "$GITHUB_ENV"
            echo 'HF_AUTH_SELECTED=OIDC'
          fi

      - name: Publish public Static Space
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HF_AUTH_MODE" = 'secret' ]; then
            python - <<'PY'
          import os
          from huggingface_hub import HfApi, create_repo
          token=os.environ['HF_PUBLISH_TOKEN']; repo_id=os.environ['SPACE_REPO']; api=HfApi(token=token)
          create_repo(repo_id=repo_id,repo_type='space',space_sdk='static',private=False,exist_ok=True,token=token)
          print(api.upload_folder(repo_id=repo_id,repo_type='space',folder_path='_hf_space_publish',commit_message='Publish YAIWES UI Factory V1.2'))
          PY
          else
            hf upload "$SPACE_REPO" _hf_space_publish . --repo-type space --commit-message "Publish YAIWES UI Factory V1.2 via GitHub OIDC ${GITHUB_SHA::7}"
          fi
          echo 'HF_SPACE_UPLOAD=PASS'

      - name: Verify persistent Space page and app host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,urllib.request
          api='https://huggingface.co/api/spaces/COMAND-CENTER-1/yaiwes-ui-factory'
          def read(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=15) as r:return r.status,r.read().decode('utf-8','ignore')
          s,b=read(api); meta=json.loads(b); app=meta.get('host')
          print('HF_META',s,meta.get('sdk'),meta.get('runtime',{}).get('stage'),app,meta.get('sha'))
          if s!=200 or meta.get('sdk')!='static' or not app: raise SystemExit('HF_SPACE_METADATA_INVALID')
          for attempt in range(36):
              try:
                  s,body=read(app.rstrip('/')+'/')
                  if s==200 and all(x in body for x in ['YAIWES UI Factory','Canvas listo','Elementos','Herramientas del paso']):
                      print('HTTP_READBACK_PASS='+app);break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit('PERSISTENT_URL_VERIFY_FAILED')
          print('HF_STATIC_SPACE_PUBLISH=PASS')
          PY
