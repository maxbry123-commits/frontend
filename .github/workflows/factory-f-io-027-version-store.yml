name: factory-f-io-027-version-store
on:
  push:
    branches: [main]
    paths:
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/version-store-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/json-roundtrip-v1.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/f-io-027-version-store.test.mjs'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-io-027-version-reopen.spec.mjs'
      - '.github/workflows/factory-f-io-027-version-store.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit gate
        run: |
          node --check src/version-store-v1.js
          node tests/f-io-027-version-store.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser reopen gate
        run: npx playwright test tests/e2e/f-io-027-version-reopen.spec.mjs --project=chromium-desktop --reporter=line
