name: UI YAIWES Reconcile Swarm Closures

on:
  push:
    paths:
      - '.github/workflows/ui-yaiwes-reconcile-wall-20260913.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile only verified node states through Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request

          owner='maxbry123-commits'; repo='frontend'; branch='main'
          path='UI YAIWES/bitácora stated JSON Craxy wall plan checkpoint/CRAZY-WALL-TASK-NODES-DYNAMIC-V5-2026-09-12.json'
          token=os.environ['GH_TOKEN']
          url=f"https://api.github.com/repos/{owner}/{repo}/contents/{urllib.parse.quote(path,safe='/')}"
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'yaiwes-supervisor-reconcile'}

          verified={
            'N03-AUTO-AUDITOR-EVIDENCE': ('5dcc89a75ff2ee1c2cf73dc55781b73316dc9745',34739510224,103678337638),
            'N14-RESEARCH-SOURCE-VERIFICATION': ('20748be1d55d8ed610181e2ef7a25f71b243be08',34739510224,103678337638),
            'N18-MEMORY-RETRIEVAL-CONTEXT': ('0799a32502e03aa052efa152b60bb7ecaf2b508b',34739510224,103678337638),
            'N22-OTEL-RUNTIME': ('081c059fcfa76dbf284d88961fe6f640ea45682f',34739510224,103678337638),
            'N24-CONSOLIDATOR': ('2823522798326816bb92b20575ffef79824fcb3e',34739510224,103678337638),
            'N29-GLOBAL-RECOVERY-FAILOVER': ('5cb855d20a1c51e4640c437e1b770c407124bc30',34738865350,103675012876),
          }

          def req(method,payload=None):
            data=None if payload is None else json.dumps(payload).encode()
            r=urllib.request.Request(url,data=data,headers=headers,method=method)
            with urllib.request.urlopen(r,timeout=30) as resp: return json.loads(resp.read().decode())

          for attempt in range(1,6):
            current=req('GET')
            doc=json.loads(base64.b64decode(current['content']).decode('utf-8'))
            byid={n['id']:n for n in doc['nodes']}
            changed=[]
            for node_id,(evidence_commit,run_id,job_id) in verified.items():
              n=byid[node_id]
              if n.get('state') != 'VERIFIED_CLOSED':
                n['state']='VERIFIED_CLOSED'
                n['report_state']='PASS_RECONCILED_FROM_TRUSTED_SWARM_EVIDENCE'
                n['reconciled_evidence_commit']=evidence_commit
                n['run_id']=run_id; n['job_id']=job_id
                n['remaining_gaps']=[]
                changed.append(node_id)
            n04=byid['N04-STATE-RECONCILIATION']
            if n04.get('state') != 'FREE' and byid['N02-TRACEABILITY-BIDIRECTIONAL']['state']=='VERIFIED_CLOSED' and byid['N03-AUTO-AUDITOR-EVIDENCE']['state']=='VERIFIED_CLOSED':
              n04['state']='FREE'; n04['owner']=None; n04['reconciled_reason']='N02+N03 dependencies VERIFIED_CLOSED'; changed.append('N04-STATE-RECONCILIATION')
            n33=byid['N33-MIRROR-TRANSPORT-CONTROL']
            if n33.get('state') == 'FREE':
              n33['state']='GAP_RESOLVABLE'; n33['owner']=None
              n33['report_state']='GAP_CI_CANCELLED_RETRY_REQUIRED'
              n33['reconciled_evidence_commit']='74ea925ef0ba117dfe94b9c55264803994597879'
              n33['run_id']=34742833971
              n33['remaining_gaps']=['authoritative global CI success required; exact prior run cancelled by concurrent main pushes']
              changed.append('N33-MIRROR-TRANSPORT-CONTROL')
            if not changed:
              print('NO_CHANGES_REQUIRED'); raise SystemExit(0)
            raw=(json.dumps(doc,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
            payload={'message':'coordination(crazy-wall): reconcile verified swarm closures','content':base64.b64encode(raw).decode(),'sha':current['sha'],'branch':branch}
            try:
              result=req('PUT',payload)
              print('RECONCILED='+','.join(changed)); print('COMMIT='+result['commit']['sha']); raise SystemExit(0)
            except urllib.error.HTTPError as e:
              if e.code not in (409,422) or attempt==5: raise
              time.sleep(1)
          PY
