name: GAP02 REQ-S3-002 Gap Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gap02-req-s3-002-gap-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/audit
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/coverage
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/src/storage/local_first.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_req_s3_002_master_input.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/tests/test_storage_local_first.py
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/requirement_traces/REQ-S3-002.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime/evidence/requirement_traces/REQ-S3-002.ci.json
            UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact trace hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES'
          echo "revision=$GITHUB_SHA"
          sha256sum "$ROOT/documentos proyectos UI YAIWES/🤯🗃️memoria del Wordflow resumen de lo que va en memoria del Wordflow para Kimi k y grock contexto de 20 millones d parámetros para el Wordflow y YAIWES.md"
          sha256sum "$ROOT/runtime/src/storage/local_first.py"
          sha256sum "$ROOT/runtime/tests/test_req_s3_002_master_input.py"
      - name: REQ-S3-002 invariant proof
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m unittest -v tests.test_req_s3_002_master_input
      - name: Local-first regression
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python -m unittest -v tests.test_storage_local_first
      - name: Focused REQ-S3-002 five-pass
        shell: bash
        run: |
          set -euo pipefail
          cd 'UI YAIWES/➡️📂 Wordflow LOOP UI YAIWES/runtime'
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from audit.evidence import TrustedCIExecution, make_ci_verifier
          from audit.five_pass import audit_five_pass
          from coverage.trace_inventory import load_trace_inventory

          runtime_root = Path.cwd()
          project_root = runtime_root.parent
          trace_root = runtime_root / "requirement_traces"
          requirement_id = "REQ-S3-002"
          traces = load_trace_inventory(trace_root, (requirement_id,))
          trace = traces[0]

          def trusted_lookup(run_id: int, job_id: int) -> TrustedCIExecution:
              assert (run_id, job_id) == (34903920516, 104176059413)
              return TrustedCIExecution(
                  run_id=run_id,
                  job_id=job_id,
                  revision="b4f62b56347df90166292373f57103a6950f7c39",
                  status="completed",
                  conclusion="success",
                  implementation_sha256=trace.implementation.sha256,
                  test_sha256=trace.test.sha256,
              )

          result = audit_five_pass(
              project_root,
              (requirement_id,),
              traces,
              (trace.implementation.path,),
              make_ci_verifier(trusted_lookup),
          )
          print(result)
          assert result.status == "TRACEABILITY_PASS", result.gaps
          assert result.verified_requirements == 1
          PY
