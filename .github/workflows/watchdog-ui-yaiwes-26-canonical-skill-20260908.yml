name: Watchdog UI YAIWES 26 Canonical Skill
run-name: Watchdog UI YAIWES 26 Canonical Skill • ${{ github.event_name }} • ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_TERMINAL_PROMPT: "0"

concurrency:
  group: frontend-watchdog-ui-yaiwes-26-canonical-skill
  cancel-in-progress: false

jobs:
  download-26-in-queue:
    name: Download 26 repos sequentially
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Copy immutable skill code and edit only sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 'https://raw.githubusercontent.com/maxbry123-commits/agentes/c789e5fe635e220230ffc759d86dc3bbb8e261d4/skills/skills%20Github%20acci%C3%B3n/scripts/research_download_chain.py' -o /tmp/research_download_chain.py
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          q=json.loads(Path('scripts/watchdog-ui-yaiwes-26-download-extract-20260908/QUEUE.json').read_text())
          repos=[(f'{i:02d}',c['slug'],c['source_url'].rstrip('/')+'.git') for i,c in enumerate(q['components'],1)]
          p=Path('/tmp/research_download_chain.py'); s=p.read_text()
          s=re.sub(r"REPOS=\[.*?\]\n",'REPOS='+repr(repos)+'\n',s,count=1)
          s=s.replace('QUEUE {number}/20:','QUEUE {number}/26:').replace('QUEUE COMPLETE: 20/20 repositories processed','QUEUE COMPLETE: 26/26 repositories processed')
          p.write_text(s)
          assert len(repos)==26
          PY
      - name: Execute deterministic download chain
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # Git LFS prohibited: never invoke git-lfs. Inherited lfs filters pass bytes unchanged.
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          git config --local core.compression 0
          python3 /tmp/research_download_chain.py 'UI YAIWES/todos los componentes/Watchdog UI/_canonical_download_26' '_work/watchdog-ui-yaiwes-26-canonical'
