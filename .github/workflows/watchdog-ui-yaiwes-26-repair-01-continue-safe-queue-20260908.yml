name: Watchdog UI YAIWES Repair 01 Continue Safe Queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/watchdog-ui-yaiwes-26-repair-01-continue-safe-queue-20260908.yml']
permissions:
  contents: write
concurrency:
  group: watchdog-ui-yaiwes-repair-01-continue-safe-queue
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Pin skill and continue only unblocked items 5-16
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          test -f 'scripts/watchdog-ui-yaiwes-26-download-extract-20260908/repair_01_continue_safe_queue.py'
          python3 scripts/watchdog-ui-yaiwes-26-download-extract-20260908/repair_01_continue_safe_queue.py
          git add -- 'UI YAIWES/todos los componentes/Watchdog UI'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'repair(watchdog-ui): continue verified queue items 5-16'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Read-back required traces for repaired items
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import json,pathlib,hashlib
          q=json.loads(pathlib.Path('scripts/watchdog-ui-yaiwes-26-download-extract-20260908/QUEUE.json').read_text())
          gaps=[]
          for c in q['components']:
              if not 5 <= c['director_index'] <= 16: continue
              d=pathlib.Path(c['destination'])
              for req in ('SOURCE_URL.txt','SOURCE_COMMIT.txt','SOURCE_LICENSE.txt','SOURCE_SHA256SUMS.txt'):
                  if not (d/req).is_file(): gaps.append(f"{c['slug']}:TRACE_MISSING:{req}")
              sums=d/'SOURCE_SHA256SUMS.txt'
              if sums.is_file():
                  for line in sums.read_text().splitlines():
                      if not line: continue
                      digest,rel=line.split('  ',1); p=d/rel
                      if not p.is_file(): gaps.append(f"{c['slug']}:READ_BACK_MISSING:{rel}"); break
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                      if h!=digest: gaps.append(f"{c['slug']}:READ_BACK_HASH_GAP:{rel}"); break
          if gaps: raise SystemExit('\n'.join(gaps))
          print('REPAIR_01_ITEMS_5_16_READ_BACK_PASS')
          print('ITEM_3_COPILOTKIT_LFS_GAP_REMAINS')
          print('ITEM_4_AGENT_UI_404_GAP_REMAINS')
          PY
