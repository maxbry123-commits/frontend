name: Import chat interface code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend target
        uses: actions/checkout@v6
        with:
          path: target

      - name: Checkout chat-frontend source
        uses: actions/checkout@v6
        with:
          repository: maxbry123-commits/chat-frontend
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GH_PAT }}
          path: source-chat
          fetch-depth: 1

      - name: Checkout nct-hub source
        uses: actions/checkout@v6
        with:
          repository: maxbry123-commits/nct-hub
          token: ${{ secrets.SOURCE_REPO_TOKEN || secrets.GH_PAT }}
          path: source-hub
          fetch-depth: 1

      # Deterministic COPY-FIRST import: source code only, preserving source paths.
      - name: Copy code only, preserving source paths
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/target"
          mkdir -p IMPORTED_CODE/CHAT_FRONTEND IMPORTED_CODE/NCT_HUB

          copy_code() {
            local src="$1"
            local dst="$2"
            find "$src" -type f \( \
              -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' -o \
              -name '*.css' -o -name '*.scss' -o -name '*.html' -o -name '*.htm' -o \
              -name '*.py' -o -name '*.sh' -o -name '*.go' -o -name '*.rs' -o \
              -name '*.java' -o -name '*.c' -o -name '*.h' -o -name '*.cpp' -o \
              -name '*.hpp' -o -name '*.vue' -o -name '*.svelte' \
            \) -print0 | while IFS= read -r -d '' f; do
              rel="${f#"$src/"}"
              mkdir -p "$dst/$(dirname "$rel")"
              cp "$f" "$dst/$rel"
            done
          }

          copy_code "$GITHUB_WORKSPACE/source-chat" "$GITHUB_WORKSPACE/target/IMPORTED_CODE/CHAT_FRONTEND"
          copy_code "$GITHUB_WORKSPACE/source-hub" "$GITHUB_WORKSPACE/target/IMPORTED_CODE/NCT_HUB"

          cd "$GITHUB_WORKSPACE/target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IMPORTED_CODE
          if git diff --cached --quiet; then
            echo 'No code changes to import.'
            exit 0
          fi
          git commit -m 'chore: import chat interface code from chat-frontend and nct-hub'
          git push
