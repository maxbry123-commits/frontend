name: Fabrica Empaque Local Repair 01 Wails
run-name: Fabrica Repair 01 Wails • ${{ github.sha }}
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fabrica-empaque-local-full-repos-repair-01-wails-20260908.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maxbry123-commits-frontend-fabrica-wails-repair-01
  cancel-in-progress: false
jobs:
  repair-wails:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
      - name: Download validate and atomically remount complete Wails repo
        shell: bash
        run: |
          set -euo pipefail
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          tmp="$RUNNER_TEMP/wails"; rm -rf "$tmp"
          git clone --depth 1 --single-branch --branch master --no-tags https://github.com/wailsapp/wails.git "$tmp"
          sha="$(git -C "$tmp" rev-parse HEAD)"
          rm -rf "$tmp/.git"
          python3 - "$tmp" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); pref=b'version https://git-lfs.github.com/spec/v1'; lim=100*1024*1024
          fs=[p for p in root.rglob('*') if p.is_file()]
          assert fs, 'EMPTY_SOURCE_TREE'
          for p in fs:
              s=p.stat().st_size
              if s>=lim: raise SystemExit('GIT_BLOB_LIMIT_GAP '+str(p.relative_to(root)))
              if s<=1024 and p.read_bytes().startswith(pref): raise SystemExit('SOURCE_LFS_POINTER_GAP '+str(p.relative_to(root)))
          print('SOURCE_PASS files='+str(len(fs)))
          PY
          dest='fabrica de UI INTERFACE fromtend/Wails'; incoming="$RUNNER_TEMP/Wails.incoming"
          rm -rf "$incoming"; cp -a "$tmp" "$incoming"
          printf '%s\n' 'https://github.com/wailsapp/wails' > "$incoming/SOURCE_URL.txt"
          printf '%s\n' "$sha" > "$incoming/SOURCE_COMMIT.txt"
          printf '%s\n' 'master' > "$incoming/SOURCE_REF.txt"
          printf '%s\n' 'MIT' > "$incoming/SOURCE_LICENSE.txt"
          python3 - "$incoming" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='SOURCE_SHA256SUMS.txt'):
              h=hashlib.sha256(p.read_bytes()).hexdigest(); rows.append(f'{h}  {p.relative_to(root).as_posix()}\n')
          (root/'SOURCE_SHA256SUMS.txt').write_text(''.join(rows))
          PY
          rm -rf "$dest"; mkdir -p "$(dirname "$dest")"; cp -a "$incoming" "$dest"
          git add -- "$dest"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'repair(fabrica): remount complete Wails repository'
          git fetch origin main
          git rebase --autostash origin/main
          git push --no-verify origin HEAD:main
      - name: Read-back Wails
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test -f 'fabrica de UI INTERFACE fromtend/Wails/SOURCE_COMMIT.txt'
          test -f 'fabrica de UI INTERFACE fromtend/Wails/SOURCE_SHA256SUMS.txt'
          cd 'fabrica de UI INTERFACE fromtend/Wails'
          sha256sum -c SOURCE_SHA256SUMS.txt
          test "$(find . -type f ! -name 'SOURCE_*' | wc -l)" -gt 0
          echo 'WAILS_EXTRACTED_VERIFIED'
