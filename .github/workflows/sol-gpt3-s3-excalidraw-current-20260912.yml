name: sol-gpt3-s3-excalidraw-current-20260912

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sol-gpt3-s3-excalidraw-current-20260912.yml'

permissions:
  contents: read

concurrency:
  group: sol-gpt3-s3-excalidraw-current-20260912
  cancel-in-progress: false

jobs:
  validate-excalidraw:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pinned Yarn
        run: npm install --global yarn@1.22.22

      - name: Verify current route and immutable source metadata
        working-directory: UI YAIWES/componentes open soure UI YAIWES/Excalidraw
        run: |
          test -f package.json
          test -f yarn.lock
          node -e "const p=require('./package.json'); if(p.name!=='excalidraw-monorepo') process.exit(2); if(p.packageManager!=='yarn@1.22.22') process.exit(3); if(!p.scripts['test:all']) process.exit(4); console.log(JSON.stringify({name:p.name,packageManager:p.packageManager,node:p.engines&&p.engines.node,test:p.scripts['test:all'],build:p.scripts.build},null,2))"
          git rev-parse HEAD
          git ls-tree HEAD -- package.json yarn.lock

      - name: Install current vendored source
        working-directory: UI YAIWES/componentes open soure UI YAIWES/Excalidraw
        env:
          HUSKY: '0'
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Build upstream source
        working-directory: UI YAIWES/componentes open soure UI YAIWES/Excalidraw
        run: yarn build

      - name: Run upstream test suite
        working-directory: UI YAIWES/componentes open soure UI YAIWES/Excalidraw
        run: yarn test:all
