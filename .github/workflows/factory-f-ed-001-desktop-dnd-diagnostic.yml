name: factory-f-ed-001-desktop-dnd-diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/f-ed-001-desktop-dnd-diagnostic.spec.mjs'
      - '.github/workflows/factory-f-ed-001-desktop-dnd-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
        run: node --check tests/e2e/f-ed-001-desktop-dnd-diagnostic.spec.mjs
      - name: Diagnose desktop DnD event chain
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
        run: npx playwright test tests/e2e/f-ed-001-desktop-dnd-diagnostic.spec.mjs --project=chromium-desktop --reporter=list
