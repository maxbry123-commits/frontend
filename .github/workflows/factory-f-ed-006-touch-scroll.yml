name: factory-f-ed-006-touch-scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factory-f-ed-006-touch-scroll.yml'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/scroll-preserver.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/src/touch-dnd-v192.js'
      - 'UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/tests/e2e/factory-v192-local-50-cycle.spec.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factory-f-ed-006-touch-scroll
  cancel-in-progress: false

jobs:
  mobile-touch-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install harness
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax F-ED-006
        run: |
          node --check src/scroll-preserver.js
          node --check src/touch-dnd-v192.js
          node --check tests/e2e/factory-v192-local-50-cycle.spec.mjs
      - name: Mobile F-ED-006 gate
        run: npx playwright test tests/e2e/factory-v192-local-50-cycle.spec.mjs --project=mobile-chromium --reporter=line
      - name: Preserve F-ED-006 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-f-ed-006-touch-scroll-evidence
          path: |
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/playwright-report
            UI YAIWES/watchdog UI YAIWES/➡️ Astra plan fábrica UI YAIWES/Frontend/factory-v0/test-results
          if-no-files-found: warn
          retention-days: 14
