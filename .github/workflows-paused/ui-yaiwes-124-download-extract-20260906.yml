name: UI YAIWES 124 Download Extract Queue
run-name: UI YAIWES 124 • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-yaiwes-124-download-extract-20260906.yml'

permissions:
  contents: write

env:
  TASK_ID: ui-yaiwes-124-download-extract-20260906
  QUEUE_FILE: scripts/ui-yaiwes-124-download-extract-20260906/QUEUE.json
  DEST: UI YAIWES/componentes open soure UI YAIWES
  SKILL_REF: c789e5fe635e220230ffc759d86dc3bbb8e261d4
  EXTRACTOR: scripts/ui-yaiwes-grupo-a-14-20260906/extract_existing_parts.py
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_LFS_SKIP_PUSH: '1'
  GIT_LFS_SKIP_DOWNLOAD: '1'
  GIT_TERMINAL_PROMPT: '0'

concurrency:
  group: maxbry123-commits-frontend-main-ui-yaiwes-componentes-open-soure-ui-yaiwes
  cancel-in-progress: false

jobs:
  queue-124:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout destination main NO-LFS
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Preflight immutable skill and exact queue
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 -c 'import json;print(json.load(open("'"$QUEUE_FILE"'"))["expected_components"])')" = "124"
          test "$(python3 -c 'import json;print(json.load(open("'"$QUEUE_FILE"'"))["destination_root"])')" = "$DEST"
          test "$(git hash-object "$EXTRACTOR")" = "a84eb1ded9740e5e08e7e17ed3a837ea46cd1484"
          mkdir -p "$RUNNER_TEMP/skill-lock" "$RUNNER_TEMP/rdc-sources" "$RUNNER_TEMP/checkpoints"
          curl -fL --retry 3 --retry-delay 3 \
            "https://raw.githubusercontent.com/maxbry123-commits/agentes/${SKILL_REF}/skills/skills%20Github%20acci%C3%B3n/Code%20Github%20acci%C3%B3n%20descargar%20y%20extracci%C3%B3n/research_download_chain.py" \
            -o "$RUNNER_TEMP/skill-lock/research_download_chain.py"
          test "$(git hash-object "$RUNNER_TEMP/skill-lock/research_download_chain.py")" = "1504bbc7ec780a351beb105df884180c9ae2c666"
          curl -fL --retry 3 --retry-delay 3 \
            "https://raw.githubusercontent.com/maxbry123-commits/agentes/${SKILL_REF}/skills/skills%20Github%20acci%C3%B3n/Code%20Github%20acci%C3%B3n%20descargar%20y%20extracci%C3%B3n/ADVERTENCIA-CODE.json" \
            -o "$RUNNER_TEMP/skill-lock/ADVERTENCIA-CODE.json"
          test "$(git hash-object "$RUNNER_TEMP/skill-lock/ADVERTENCIA-CODE.json")" = "f62bee5aa59d25721be6e075778ab670b5525b7a"
          git config --local filter.lfs.clean cat
          git config --local filter.lfs.smudge cat
          git config --local filter.lfs.process ''
          git config --local filter.lfs.required false
          git config --local core.autocrlf false

      - name: Process 124 components sequentially with pinned source SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RDC_SOURCE_ROOT: ${{ runner.temp }}/rdc-sources
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gaps.tsv"
          python3 - "$QUEUE_FILE" > "$RUNNER_TEMP/queue.tsv" <<'PY'
          import json,sys
          q=json.load(open(sys.argv[1],encoding='utf-8'))
          for c in q['components']:
              print(f"{c['director_index']}\t{c['slug']}\t{c['source_url']}")
          PY

          while IFS=$'\t' read -r idx slug url; do
            echo "===== QUEUE ${idx}/124: ${slug} ====="
            src="$RDC_SOURCE_ROOT/$slug"
            rm -rf "$src"

            if [[ "$url" != https://github.com/* ]]; then
              printf '%s\t%s\t%s\n' "$idx" "$slug" "SOURCE_PROVIDER_GAP:$url" >> "$RUNNER_TEMP/gaps.tsv"
              echo "GAP ${slug}: locked publisher currently accepts GitHub source URLs only"
              continue
            fi

            set +e
            pinned=$(git ls-remote "$url" HEAD 2>/dev/null | awk 'NR==1{print $1}')
            resolve_rc=$?
            set -e
            if [[ $resolve_rc -ne 0 || ! "$pinned" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s\t%s\t%s\n' "$idx" "$slug" "SOURCE_REF_GAP" >> "$RUNNER_TEMP/gaps.tsv"
              continue
            fi

            set +e
            git -c filter.lfs.smudge= -c filter.lfs.clean= -c filter.lfs.process= -c filter.lfs.required=false \
              clone --depth 1 --single-branch --no-tags "$url" "$src"
            clone_rc=$?
            set -e
            if [[ $clone_rc -ne 0 ]]; then
              printf '%s\t%s\t%s\n' "$idx" "$slug" "CLONE_GAP:$url" >> "$RUNNER_TEMP/gaps.tsv"
              rm -rf "$src"
              continue
            fi
            actual=$(git -C "$src" rev-parse HEAD)
            if [[ "$actual" != "$pinned" ]]; then
              printf '%s\t%s\t%s\n' "$idx" "$slug" "SOURCE_REF_MOVED_GAP:pinned=$pinned actual=$actual" >> "$RUNNER_TEMP/gaps.tsv"
              rm -rf "$src"
              continue
            fi

            plan="$RUNNER_TEMP/plan-${idx}.json"
            python3 - "$src" "$slug" "$url" "$pinned" "$idx" "$plan" <<'PY'
          import json, pathlib, subprocess, sys
          src,slug,url,sha,idx,out=sys.argv[1:]
          raw=subprocess.check_output(['git','-C',src,'ls-tree','-r','-z',sha])
          items=[]; blocked=[]; licenses=[]
          for entry in raw.split(b'\0'):
              if not entry: continue
              meta,path_b=entry.split(b'\t',1)
              mode,typ,blob=meta.decode().split()
              path=path_b.decode('utf-8','surrogateescape')
              if typ!='blob' or mode not in ('100644','100755','120000'):
                  blocked.append({'component':slug,'path':path,'reason':f'SOURCE_MODE_GAP:{mode}:{typ}'})
                  continue
              size=int(subprocess.check_output(['git','-C',src,'cat-file','-s',blob],text=True).strip())
              items.append({'component':slug,'parts':0,'path':path,'source_blob':blob,'source_commit':sha,'source_mode':mode,'source_size':size,'source_url':url})
              base=pathlib.PurePosixPath(path).name.lower()
              if base.startswith(('license','copying','notice')):
                  licenses.append(path)
          plan={
            'task_id':f'ui-yaiwes-124-{int(idx):03d}',
            'destination_repository':'maxbry123-commits/frontend',
            'destination_branch':'main',
            'destination_root':'UI YAIWES/componentes open soure UI YAIWES',
            'components':[{'name':slug,'source_url':url,'source_commit':sha,'expected_files':len(items),'license_files':sorted(set(licenses))}],
            'items':items,'blocked':blocked,'overwrite':False,'delete':False
          }
          pathlib.Path(out).write_text(json.dumps(plan,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

            set +e
            python3 "$EXTRACTOR" --queue "$plan"
            repair_rc=$?
            set -e
            checkpoint="$RUNNER_TEMP/ui-yaiwes-124-$(printf '%03d' "$idx")-checkpoint.json"
            if [[ -f "$checkpoint" ]]; then
              cp "$checkpoint" "$RUNNER_TEMP/checkpoints/"
            fi
            if [[ $repair_rc -ne 0 ]]; then
              printf '%s\t%s\t%s\n' "$idx" "$slug" "COMPONENT_GAP:repair_rc=$repair_rc" >> "$RUNNER_TEMP/gaps.tsv"
            fi
            rm -rf "$src" "$plan"
          done < "$RUNNER_TEMP/queue.tsv"

      - name: Verify final destination and independent read-back snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - "$QUEUE_FILE" "$DEST" "$RUNNER_TEMP/gaps.tsv" "$RUNNER_TEMP/verify-final.json" <<'PY'
          import hashlib,json,pathlib,sys
          q=json.load(open(sys.argv[1],encoding='utf-8')); root=pathlib.Path(sys.argv[2]); gapfile=pathlib.Path(sys.argv[3]); out=pathlib.Path(sys.argv[4])
          prior=[]
          if gapfile.exists():
              prior=[line.rstrip('\n').split('\t',2) for line in gapfile.read_text(encoding='utf-8').splitlines() if line.strip()]
          results=[]; verified=0
          for c in q['components']:
              d=root/c['slug']; reasons=[]
              if not d.is_dir(): reasons.append('DESTINATION_MISSING')
              else:
                  for f in ('SOURCE_URL.txt','SOURCE_COMMIT.txt','SOURCE_SHA256SUMS.txt'):
                      if not (d/f).is_file(): reasons.append('TRACE_MISSING:'+f)
                  sums=d/'SOURCE_SHA256SUMS.txt'
                  if sums.is_file():
                      for line in sums.read_text(encoding='utf-8',errors='replace').splitlines():
                          if not line.strip(): continue
                          try: digest,rel=line.split('  ',1); p=d/rel
                          except ValueError: reasons.append('SUM_FORMAT_GAP'); break
                          if not p.is_file(): reasons.append('READ_BACK_MISSING:'+rel); break
                          h=hashlib.sha256()
                          with p.open('rb') as fh:
                              for b in iter(lambda:fh.read(1024*1024),b''): h.update(b)
                          if h.hexdigest()!=digest: reasons.append('READ_BACK_HASH_GAP:'+rel); break
              if not reasons: verified+=1
              results.append({'director_index':c['director_index'],'name':c['name'],'slug':c['slug'],'status':'VERIFIED' if not reasons else 'GAP','reasons':reasons})
          summary={'task_id':q['task_id'],'expected':124,'verified':verified,'pending_or_gap':124-verified,'prior_gaps':prior,'destination_root':str(root),'results':results,'verdict':'PENDING_INDEPENDENT_AUDITOR' if verified==124 and not prior else 'ACTIVE_LOOP'}
          out.write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:summary[k] for k in ('expected','verified','pending_or_gap','verdict')},ensure_ascii=False))
          PY

      - name: Preserve watchdog checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-yaiwes-124-download-extract-20260906-checkpoints
          path: |
            ${{ runner.temp }}/checkpoints/
            ${{ runner.temp }}/verify-final.json
            ${{ runner.temp }}/gaps.tsv
          if-no-files-found: warn

      - name: Fail closed until 124 verified
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          verified=$(python3 -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/verify-final.json"))["verified"])')
          test "$verified" -eq 124
          test ! -s "$RUNNER_TEMP/gaps.tsv"
          echo '124/124 CONTENT READ-BACK PASS; independent watchdog audit still required.'
