# skills/skills Github acción/Mover lotes de archivos/gha-move-root-or-files.yml
# Fuente: https://github.com/actions/checkout
name: UI YAIWES move 14 components to open source root
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-yaiwes-move-14-to-open-source-20260906.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_TERMINAL_PROMPT: "0"
concurrency:
  group: ui-yaiwes-move-14-open-source
  cancel-in-progress: false
jobs:
  move-same-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true
      - name: Move 14 component roots same repo
        run: |
          set -euo pipefail
          DEST="UI YAIWES/componentes open soure UI YAIWES"
          mkdir -p "$DEST"
          git mv "UI YAIWES/Stabilize CORE" "$DEST/Stabilize CORE"
          git mv "UI YAIWES/Pydantic" "$DEST/Pydantic"
          git mv "UI YAIWES/Bulkman" "$DEST/Bulkman"
          git mv "UI YAIWES/resilient-circuit" "$DEST/resilient-circuit"
          git mv "UI YAIWES/Rule Engine" "$DEST/Rule Engine"
          git mv "UI YAIWES/Starlette" "$DEST/Starlette"
          git mv "UI YAIWES/HTTPX" "$DEST/HTTPX"
          git mv "UI YAIWES/structlog" "$DEST/structlog"
          git mv "UI YAIWES/OpenTelemetry Python" "$DEST/OpenTelemetry Python"
          git mv "UI YAIWES/pytest" "$DEST/pytest"
          git mv "UI YAIWES/Hypothesis" "$DEST/Hypothesis"
          git mv "UI YAIWES/Dagu" "$DEST/Dagu"
          git mv "UI YAIWES/redun" "$DEST/redun"
          git mv "UI YAIWES/Apache PyCasbin" "$DEST/Apache PyCasbin"
      - name: Commit push main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo 'NO CHANGE' && exit 0
          git commit -m "move: 14 UI YAIWES components to open source root"
          git push origin HEAD:main
